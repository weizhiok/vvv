name: Validate ordinary source install

on:
  workflow_dispatch:
  push:
    paths:
      - 'vvv-install.sh'
      - 'src/**'
      - 'core-src/**'
      - '.github/workflows/validate-ordinary.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce installer preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/vvv-app validation
          mkdir -p /tmp/vvv-app validation
          cp src/bootstrap.sh /tmp/vvv-app/bootstrap.sh
          cp core-src/host.sh core-src/landing.sh core-src/center_install.sh \
             core-src/register_sync.sh core-src/vvv_manager.sh \
             core-src/sub_center.py core-src/sync_agent.py /tmp/vvv-app/

          python3 -m py_compile src/prepare.py
          python3 src/prepare.py /tmp/vvv-app/host.sh /tmp/vvv-app/landing.sh /tmp/vvv-app/center_install.sh

          bash -n vvv-install.sh
          for file in bootstrap.sh center_install.sh register_sync.sh vvv_manager.sh host.sh; do
            bash -n "/tmp/vvv-app/$file"
          done
          sh -n /tmp/vvv-app/landing.sh
          python3 -m py_compile /tmp/vvv-app/sub_center.py /tmp/vvv-app/sync_agent.py

          {
            echo 'status=ok'
            echo 'transport=ordinary-files'
            echo 'base64=disabled'
            echo 'shell=ok'
            echo 'python=ok'
            echo 'prepare=ok'
          } > validation/ordinary-source.txt

      - name: Commit validation result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/ordinary-source.txt
          git diff --cached --quiet && exit 0
          git commit -m '验证普通源码安装流程'
          git push
