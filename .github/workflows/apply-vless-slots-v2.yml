name: Apply repaired VLESS slot architecture
on:
  push:
    paths:
      - '.github/workflows/apply-vless-slots-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            set -Eeuxo pipefail
            python3 -m py_compile tools/repair_patch_anchor.py
            python3 tools/repair_patch_anchor.py
            python3 -m py_compile tools/patch_vless_slots.py
            python3 tools/patch_vless_slots.py
            python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            bash -n /tmp/host.sh
            sh -n /tmp/landing.sh
            sh -n /tmp/center.sh
            grep -q 'build_vless_slot_configs' /tmp/host.sh
            grep -q 'vvv-vless-slot@' /tmp/host.sh
            grep -q 'build_hy2_slot_configs' /tmp/host.sh
            grep -q 'vvv-hy2-slot@' /tmp/host.sh
            grep -q '主 Xray PID 已保持不变' /tmp/host.sh
            grep -q '主 sing-box PID 已保持不变' /tmp/host.sh
          } > validation/apply-vless-v2.log 2>&1
      - name: Publish result
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$VALIDATE_OUTCOME" == success ]]; then
            printf 'status=success\n' >> validation/apply-vless-v2.log
            git add src/prepare.py validation/apply-vless-v2.log
            git commit -m 'Use isolated VLESS and HY2 relay slots'
          else
            printf 'status=failure\n' >> validation/apply-vless-v2.log
            git add validation/apply-vless-v2.log
            git commit -m 'Record VLESS slot validation failure'
          fi
          git push
          [[ "$VALIDATE_OUTCOME" == success ]]
