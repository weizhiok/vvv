name: Fix IPv4 manager testability
on:
  push:
    branches: [agent/fix-ipv4-manager-runtime]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ipv4-manager-runtime
      - name: Apply runtime-path compatibility patch
        run: python3 tools/fix_ipv4_manager_testability.py
      - name: Run focused manager/runtime checks
        run: |
          bash -n core-src/host.sh
          bash -n tests/final_runtime_validation.sh
          python3 -m py_compile tests/test_ipv4_only.py core-src/client_package_renderer.py tests/test_created_node_client_output.py
          python3 tests/test_ipv4_only.py
          python3 tests/test_created_node_client_output.py
          python3 tests/extract_manager_library.py core-src/host.sh /tmp/manager-lib.sh
          bash -n /tmp/manager-lib.sh
          VVV_IPV4_ONLY_MODULE="$PWD/core-src/ipv4_only.sh" bash -c 'source /tmp/manager-lib.sh'
      - name: Commit focused compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/host.sh tests/test_ipv4_only.py tests/final_runtime_validation.sh
          git diff --cached --quiet && exit 0
          git commit -m "Keep IPv4 manager runtime dependency testable"
          git push
