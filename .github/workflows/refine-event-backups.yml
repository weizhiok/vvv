name: Refine VVV event backups
on:
  push:
    paths:
      - '.github/workflows/refine-event-backups.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch event semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('core-src/sub_center.py')
          s=p.read_text(encoding='utf-8')
          anchor="""def auth_token(handler):
              value=handler.headers.get('Authorization','')
              return value[7:] if value.startswith('Bearer ') else ''
          """
          helper="""def structural_state(value):
              ignored={'updated_at','last_checked_at','last_exit_ip','last_status','latency_ms'}
              if isinstance(value,dict):
                  return {k:structural_state(v) for k,v in value.items() if k not in ignored}
              if isinstance(value,list):
                  return [structural_state(v) for v in value]
              return value


          """
          if anchor not in s: raise SystemExit('auth anchor missing')
          s=s.replace(anchor,anchor+'\n\n'+helper,1)
          old="""                backup('before-node-sync'); doc={'host_id':entry['host_id'],'role':entry.get('role','direct'),'state':body.get('state') or {},'meta':body.get('meta') or {},'last_seen':now(),'last_seen_ts':time.time()}; atomic_json(HOSTS/f\"{entry['host_id']}.json\",doc); count=regenerate(); backup('after-node-sync')
                return self.send_bytes(200,json.dumps({'ok':True,'node_count':count},ensure_ascii=False).encode(),'application/json')
          """
          new="""                host_path=HOSTS/f\"{entry['host_id']}.json\"
                previous=read_json(host_path,{}) or {}
                new_state=body.get('state') or {}
                role=entry.get('role','direct')
                was_stale=bool(previous.get('last_seen_ts') and time.time()-float(previous.get('last_seen_ts'))>72*3600 and role=='direct')
                changed=(previous.get('role')!=role or structural_state(previous.get('state') or {})!=structural_state(new_state) or was_stale)
                if changed: backup('before-node-sync')
                doc={'host_id':entry['host_id'],'role':role,'state':new_state,'meta':body.get('meta') or {},'last_seen':now(),'last_seen_ts':time.time()}
                atomic_json(host_path,doc)
                count=regenerate() if changed or not (OUT/'nodes.json').exists() else int((read_json(OUT/'nodes.json',{}) or {}).get('count',0))
                if changed: backup('after-node-sync')
                return self.send_bytes(200,json.dumps({'ok':True,'node_count':count,'changed':changed},ensure_ascii=False).encode(),'application/json')
          """
          if old not in s: raise SystemExit('sync block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('core-src/rclone_manager.sh'); s=p.read_text(encoding='utf-8')
          old='''  rm -f "$CLOUD_CFG" "$RCLONE_CFG"
            echo "云备份已关闭。本地加密备份不受影响。"'''
          new='''  rm -f "$CLOUD_CFG" "$RCLONE_CFG"
            python3 "$BACKUP" create after-cloud-backup-disabled --force >/dev/null || true
            echo "云备份已关闭。本地加密备份不受影响。"'''
          if old not in s: raise SystemExit('rclone disable block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('core-src/vvv_manager.sh'); s=p.read_text(encoding='utf-8')
          old='''  curl -fsSL --retry 5 "https://raw.githubusercontent.com/weizhiok/vvv/install/vvv-install.sh?$(date +%s)" | bash
          }'''
          new='''  curl -fsSL --retry 5 "https://raw.githubusercontent.com/weizhiok/vvv/install/vvv-install.sh?$(date +%s)" | bash
            role_has center && python3 /usr/local/lib/vvv/backup_manager.py create after-vvv-upgrade --force >/dev/null || true
          }'''
          if old not in s: raise SystemExit('upgrade block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile core-src/sub_center.py
          bash -n core-src/rclone_manager.sh
          bash -n core-src/vvv_manager.sh
          grep -q 'structural_state' core-src/sub_center.py
          grep -q 'if changed: backup' core-src/sub_center.py
          grep -q 'after-cloud-backup-disabled' core-src/rclone_manager.sh
          grep -q 'after-vvv-upgrade' core-src/vvv_manager.sh
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/sub_center.py core-src/rclone_manager.sh core-src/vvv_manager.sh
          git commit -m 'Backup only on meaningful state changes'
          git push
