name: Apply unified subscription transports
on:
  push:
    branches: [agent/unified-subscription-transports]
    paths:
      - 'trigger-unified-subscription-transports.txt'
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: unified-subscription-transports
  cancel-in-progress: true
jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/unified-subscription-transports' || github.ref_name == 'agent/unified-subscription-transports'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-subscription-transports
          fetch-depth: 0
      - name: Apply remaining production patch
        run: python3 tools/apply_unified_subscription_patch.py
      - name: Validate source
        run: |
          set -Eeuo pipefail
          git diff --check
          bash -n vvv-install.sh
          bash -n core-src/bootstrap.sh
          bash -n core-src/center_install.sh
          bash -n core-src/center_transport.sh
          bash -n core-src/center_manager.sh
          bash -n core-src/register_sync.sh
          bash -n core-src/vvv_manager.sh
          bash -n core-src/rclone_manager.sh
          bash -n core-src/host.sh
          sh -n core-src/landing.sh
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py core-src/client_adapters.py core-src/adapter_manager.py tests/conformance.py
          python3 core-src/client_adapters.py
          python3 tests/conformance.py
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_unified_subscription_patch.py trigger-unified-subscription-transports.txt .github/workflows/apply-unified-subscription-transports.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Add unified subscription transports and adapters"
          git push origin HEAD:agent/unified-subscription-transports
