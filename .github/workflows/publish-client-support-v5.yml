name: Publish client support v5
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-client-support-v5.yml'
permissions:
  contents: write
concurrency:
  group: publish-client-support-v5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release adapter
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/client_upgrade_engine.py
          python3 core-src/client_adapters.py >/dev/null
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('engine', 'core-src/client_upgrade_engine.py')
          engine = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(engine)
          engine.validate_restricted_source(Path('core-src/client_adapters.py'))
          module, version, formats, outputs = engine.module_contract(Path('core-src/client_adapters.py'))
          assert version == 5 and 'shadowrocket' in formats and 'nekobox-import' in formats
          assert any(row.get('filename') == 'Loon-Import.txt' for row in outputs)
          PY
      - name: Publish exact adapter to client-support
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin client-support
          git worktree add /tmp/vvv-client-support origin/client-support
          cp core-src/client_adapters.py /tmp/vvv-client-support/client_upgrade.py
          cd /tmp/vvv-client-support
          python3 client_upgrade.py >/dev/null
          git add client_upgrade.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish client support v5'
            git push origin HEAD:client-support
          fi
