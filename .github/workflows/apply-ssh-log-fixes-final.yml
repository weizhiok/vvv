name: Apply final SSH log fixes
on:
  push:
    paths:
      - '.github/workflows/apply-ssh-log-fixes-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/run_final_ssh_fix.sh
