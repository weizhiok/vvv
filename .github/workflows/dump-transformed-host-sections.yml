name: Dump transformed host slot sections
on:
  push:
    paths:
      - '.github/workflows/dump-transformed-host-sections.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transform and capture sections
        shell: bash
        run: |
          set -Eeuo pipefail
          cp core-src/host.sh /tmp/host.sh
          cp core-src/landing.sh /tmp/landing.sh
          cp core-src/center_install.sh /tmp/center.sh
          python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          mkdir -p validation
          {
            for p in 'clients=' 'api-in' 'test_rules=' 'private_ips=' 'cfg={' 'allocate_vless_slot' 'test_vless=' 'test_port=' 'xray_dynamic_parts' 'xray_hot_apply' 'build_hy2_slot_configs' 'apply_candidate_with_rollback'; do
              echo "===== $p ====="
              grep -n -C 16 "$p" /tmp/host.sh || true
            done
          } > validation/transformed-host-sections.txt
      - name: Commit dump
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add validation/transformed-host-sections.txt
          git commit -m 'Dump transformed host slot sections'
          git push
