name: Apply immediate center migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: immediate-center-migration
  cancel-in-progress: true
jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/unified-subscription-transports'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-subscription-transports
          fetch-depth: 0
      - name: Apply immediate migration patch
        run: python3 tools/apply_immediate_center_migration.py
      - name: Validate
        run: |
          set -Eeuo pipefail
          git diff --check
          bash -n core-src/bootstrap.sh
          python3 -m py_compile tests/conformance.py
          python3 tests/conformance.py
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_immediate_center_migration.py .github/workflows/apply-immediate-center-migration.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Refresh migrated centers before menu"
          git push origin HEAD:agent/unified-subscription-transports
