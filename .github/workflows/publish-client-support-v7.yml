name: Publish client support v7
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-client-support-v7.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate source adapter
        run: |
          set -Eeuo pipefail
          python3 core-src/client_adapters.py | tee /tmp/client-adapter.json
          grep -q '"version": 7' /tmp/client-adapter.json
          grep -q 'nekobox-sn' /tmp/client-adapter.json
      - name: Publish exact adapter to client-support
        run: |
          set -Eeuo pipefail
          cp core-src/client_adapters.py /tmp/client_upgrade.py
          git fetch origin client-support
          git checkout -B client-support origin/client-support
          cp /tmp/client_upgrade.py client_upgrade.py
          python3 client_upgrade.py | tee /tmp/published-adapter.json
          grep -q '"version": 7' /tmp/published-adapter.json
          grep -q 'nekobox-sn' /tmp/published-adapter.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client_upgrade.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish client support v7'
            git push origin client-support
          fi
