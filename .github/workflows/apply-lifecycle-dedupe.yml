name: Apply lifecycle dedupe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dedupe-node-lifecycle-source
          fetch-depth: 0
      - name: Deduplicate and validate
        run: |
          set -Eeuo pipefail
          python3 tools/dedupe_node_lifecycle.py
          bash -n core-src/host.sh
          python3 tests/test_lifecycle_source_uniqueness.py
          chmod +x tests/test_node_lifecycle.sh tests/test_deleted_slot_reclaim.sh
          tests/test_node_lifecycle.sh
          tests/test_deleted_slot_reclaim.sh
          python3 tests/conformance.py
      - name: Commit production source
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/host.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove duplicate lifecycle source definitions'
          git push origin HEAD:agent/dedupe-node-lifecycle-source
