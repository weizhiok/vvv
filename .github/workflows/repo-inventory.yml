name: Inventory repository before final cleanup
on:
  push:
    paths:
      - '.github/workflows/repo-inventory.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build inventory
        run: |
          set -Eeuo pipefail
          mkdir -p validation
          {
            echo '=== branches ==='
            git branch -a
            echo '=== root ==='
            find . -maxdepth 2 -type f -not -path './.git/*' -printf '%p\n' | sort
            echo '=== workflows ==='
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
            echo '=== staging ==='
            find .staging-refactor -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
            echo '=== tools ==='
            find tools -maxdepth 1 -type f -printf '%p\n' 2>/dev/null | sort || true
            echo '=== validation ==='
            find validation -maxdepth 1 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
            echo '=== Python compile ==='
            python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
            echo '=== current HEAD ==='
            git log -1 --format='%H %cI %s'
          } > validation/repo-inventory.txt
      - name: Publish inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/repo-inventory.txt
          git commit -m 'Record pre-cleanup repository inventory'
          git push
