name: Diagnose VVV refactor
on:
  push:
    paths:
      - '.github/workflows/diagnose-refactor.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/vvv-diag
          report=validation/refactor-diagnostic.txt
          : > "$report"
          run() {
            echo "===== $1 =====" >> "$report"
            shift
            "$@" >> "$report" 2>&1
            rc=$?
            echo "exit=$rc" >> "$report"
            return 0
          }
          run decode base64 -d .staging-refactor/prepare.py.b64
          base64 -d .staging-refactor/prepare.py.b64 > /tmp/vvv-diag/prepare.py 2>>"$report"
          cp core-src/host.sh /tmp/vvv-diag/host.sh
          cp core-src/landing.sh /tmp/vvv-diag/landing.sh
          cp core-src/center_install.sh /tmp/vvv-diag/center_install.sh
          run py_compile python3 -m py_compile /tmp/vvv-diag/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
          run transform python3 /tmp/vvv-diag/prepare.py /tmp/vvv-diag/host.sh /tmp/vvv-diag/landing.sh /tmp/vvv-diag/center_install.sh
          run host_syntax bash -n /tmp/vvv-diag/host.sh
          run landing_syntax sh -n /tmp/vvv-diag/landing.sh
          for f in core-src/center_install.sh core-src/register_sync.sh core-src/vvv_manager.sh core-src/rclone_manager.sh core-src/qr_helper.sh src/bootstrap.sh vvv-install.sh; do
            run "syntax:$f" bash -n "$f"
          done
          for pattern in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do
            echo "===== grep:$pattern =====" >> "$report"
            grep -n "$pattern" /tmp/vvv-diag/host.sh | head -5 >> "$report" 2>&1
            echo "exit=$?" >> "$report"
          done
          echo "===== forbidden =====" >> "$report"
          grep -nE 'salamander-password=\{loon_q|/api/v1/backup|pull-backup|vvv-backup-pull' /tmp/vvv-diag/host.sh /tmp/vvv-diag/landing.sh core-src/sub_center.py core-src/sync_agent.py core-src/register_sync.sh >> "$report" 2>&1
          echo "exit=$?" >> "$report"
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/refactor-diagnostic.txt
          git commit -m 'Record VVV refactor diagnostics'
          git push
