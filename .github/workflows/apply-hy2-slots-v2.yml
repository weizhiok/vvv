name: Apply HY2 slot architecture
on:
  push:
    paths:
      - '.github/workflows/apply-hy2-slots-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            set -Eeuxo pipefail
            git show c4c0dcf793a1158f3d5829775de95185876db6b9:.staging-refactor/patch-hy2-runtime.gz.b64 > .staging-refactor/patch-hy2-runtime.gz.b64
            python3 -m py_compile tools/decode_staged_hy2.py
            python3 tools/decode_staged_hy2.py
            gzip -t /tmp/hy2-static.gz
            gzip -t /tmp/hy2-runtime.gz
            gzip -dc /tmp/hy2-static.gz > /tmp/hy2-static.py
            gzip -dc /tmp/hy2-runtime.gz > /tmp/hy2-runtime.py
            python3 -m py_compile /tmp/hy2-static.py /tmp/hy2-runtime.py
            python3 /tmp/hy2-static.py
            python3 /tmp/hy2-runtime.py
            python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            bash -n /tmp/host.sh
            sh -n /tmp/landing.sh
            sh -n /tmp/center.sh
            grep -q 'reserve-h' /tmp/host.sh
            grep -q 'build_hy2_slot_configs' /tmp/host.sh
            grep -q 'vvv-hy2-slot@' /tmp/host.sh
            grep -q 'sync_hy2_slot_services' /tmp/host.sh
            grep -q 'block-unused-vless' /tmp/host.sh
            grep -q '主 sing-box PID 已保持不变' /tmp/host.sh
          } > validation/apply-hy2-v2.log 2>&1
      - name: Publish result
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$VALIDATE_OUTCOME" == success ]]; then
            printf 'status=success\n' >> validation/apply-hy2-v2.log
            git add src/prepare.py validation/apply-hy2-v2.log
            git commit -m 'Keep main HY2 service alive during relay changes'
          else
            printf 'status=failure\n' >> validation/apply-hy2-v2.log
            git add validation/apply-hy2-v2.log
            git commit -m 'Record HY2 slot validation failure'
          fi
          git push
          [[ "$VALIDATE_OUTCOME" == success ]]
