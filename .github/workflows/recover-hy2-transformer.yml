name: Recover HY2 transformer
on:
  push:
    paths:
      - '.github/workflows/recover-hy2-transformer.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and inspect
        id: recover
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            set -Eeuxo pipefail
            git ls-tree -r --name-only HEAD .staging-refactor
            python3 -m py_compile tools/recover_hy2_transformer.py
            python3 tools/recover_hy2_transformer.py
            python3 -m py_compile /tmp/recovered-prepare.py
            grep -n 'build_hy2_slot_configs\|sync_hy2_slot_services\|vvv-hy2-slot@' /tmp/recovered-prepare.py | head -30
            sha256sum /tmp/recovered-prepare.py
          } > validation/recover-hy2-transformer.log 2>&1
      - name: Publish diagnostic
        if: always()
        shell: bash
        env:
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'status=%s\n' "$RECOVER_OUTCOME" >> validation/recover-hy2-transformer.log
          git add validation/recover-hy2-transformer.log
          git commit -m 'Record HY2 transformer recovery'
          git push
          [[ "$RECOVER_OUTCOME" == success ]]
