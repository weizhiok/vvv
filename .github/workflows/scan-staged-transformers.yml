name: Scan staged transformer candidates
on:
  push:
    paths:
      - '.github/workflows/scan-staged-transformers.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan candidates
        run: |
          set -Eeuo pipefail
          mkdir -p validation
          python3 -m py_compile tools/scan_staged_transformers.py
          python3 tools/scan_staged_transformers.py > validation/staged-transformers-scan.log 2>&1
      - name: Publish scan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/staged-transformers-scan.log
          git commit -m 'Record staged transformer scan'
          git push
