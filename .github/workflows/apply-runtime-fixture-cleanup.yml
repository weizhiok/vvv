name: Apply runtime fixture cleanup
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/remove_v2_runtime_fixture.py'
      - 'trigger-runtime-fixture-cleanup.txt'
      - '.github/workflows/apply-runtime-fixture-cleanup.yml'
permissions:
  contents: write
concurrency:
  group: apply-runtime-fixture-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-v2-fix-menu-bootstrap
          fetch-depth: 0
      - name: Update runtime fixture
        run: python3 tools/remove_v2_runtime_fixture.py
      - name: Verify cleanup
        run: |
          set -Eeuo pipefail
          bash -n tests/final_runtime_validation.sh
          python3 tests/conformance.py
          ! grep -RInE 'v2rayNG|v2rayng' core-src/host.sh core-src/landing.sh core-src/center_install.sh core-src/sub_center.py tests/final_runtime_validation.sh
      - name: Commit cleanup
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/remove_v2_runtime_fixture.py trigger-runtime-fixture-cleanup.txt .github/workflows/apply-runtime-fixture-cleanup.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Remove v2rayNG runtime fixture"
          git push origin HEAD:agent/remove-v2-fix-menu-bootstrap
