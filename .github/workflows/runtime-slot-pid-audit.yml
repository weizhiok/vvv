name: Audit live main process PID preservation
on:
  push:
    paths:
      - '.github/workflows/runtime-slot-pid-audit.yml'
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start main and slot processes
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation /tmp/vvv-slot-runtime
          {
            set -Eeuxo pipefail
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            python3 tools/extract_manager_library.py /tmp/host.sh /tmp/jp-relay-manager-lib.sh
            source /tmp/jp-relay-manager-lib.sh

            XRAY_VERSION="$(sed -n 's/^XRAY_FALLBACK_VERSION="\([^"]*\)"/\1/p' /tmp/jp-relay-manager-lib.sh | head -n1)"
            SING_VERSION="$(sed -n 's/^SING_BOX_FALLBACK_VERSION="\([^"]*\)"/\1/p' /tmp/jp-relay-manager-lib.sh | head -n1)"
            curl -fL --retry 5 --retry-all-errors "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
            unzip -q /tmp/xray.zip xray -d /tmp/xray-unpack
            install -m755 /tmp/xray-unpack/xray /tmp/xray
            curl -fL --retry 5 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz" -o /tmp/sing-box.tgz
            tar -xzf /tmp/sing-box.tgz -C /tmp
            install -m755 "/tmp/sing-box-${SING_VERSION}-linux-amd64/sing-box" /tmp/sing-box
            XRAY=/tmp/xray
            SING_BOX=/tmp/sing-box
            HY2_LIMIT_MBPS=50

            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -nodes -days 7 \
              -subj '/CN=jp-hy2.jp-relay.local' -addext 'subjectAltName=DNS:jp-hy2.jp-relay.local' \
              -keyout /tmp/vvv-slot-runtime/server.key -out /tmp/vvv-slot-runtime/server.crt >/dev/null 2>&1
            parse_x25519_keys "$($XRAY x25519)"
            export VVV_AUDIT_REALITY_PRIVATE="$GENERATED_PRIVATE_KEY"
            export VVV_AUDIT_REALITY_PUBLIC="$GENERATED_PUBLIC_KEY"
            parse_x25519_keys "$($XRAY x25519)"
            export VVV_AUDIT_REMOTE_PUBLIC="$GENERATED_PUBLIC_KEY"
            export VVV_AUDIT_CERT_PATH=/tmp/vvv-slot-runtime/server.crt
            export VVV_AUDIT_KEY_PATH=/tmp/vvv-slot-runtime/server.key
            export AUDIT_DIR=/tmp/vvv-slot-runtime
            python3 tools/build_slot_audit_fixture.py
            build_xray_config /tmp/vvv-slot-runtime/state-active.json /tmp/vvv-slot-runtime/xray-main.json
            build_sing_config /tmp/vvv-slot-runtime/state-active.json /tmp/vvv-slot-runtime/sing-main.json
            mkdir -p /tmp/vvv-slot-runtime/vless /tmp/vvv-slot-runtime/hy2
            build_vless_slot_configs /tmp/vvv-slot-runtime/state-active.json /tmp/vvv-slot-runtime/vless
            build_hy2_slot_configs /tmp/vvv-slot-runtime/state-active.json /tmp/vvv-slot-runtime/hy2

            cleanup_runtime() {
              set +e
              for pid in ${V1_PID:-} ${V2_PID:-} ${H1_PID:-} ${XRAY_MAIN_PID:-} ${SING_MAIN_PID:-}; do
                [[ -z "$pid" ]] || kill "$pid" 2>/dev/null || true
              done
              wait 2>/dev/null || true
            }
            trap cleanup_runtime EXIT

            /tmp/xray run -format=json -config /tmp/vvv-slot-runtime/xray-main.json > /tmp/vvv-slot-runtime/xray-main.log 2>&1 &
            XRAY_MAIN_PID=$!
            /tmp/sing-box run -c /tmp/vvv-slot-runtime/sing-main.json > /tmp/vvv-slot-runtime/sing-main.log 2>&1 &
            SING_MAIN_PID=$!
            sleep 3
            kill -0 "$XRAY_MAIN_PID"
            kill -0 "$SING_MAIN_PID"
            XRAY_START="$(awk '{print $22}' /proc/${XRAY_MAIN_PID}/stat)"
            SING_START="$(awk '{print $22}' /proc/${SING_MAIN_PID}/stat)"
            ss -H -lntp 'sport = :24443' | grep -q "pid=${XRAY_MAIN_PID}"
            ss -H -lnup 'sport = :24443' | grep -q "pid=${SING_MAIN_PID}"

            /tmp/xray run -format=json -config /tmp/vvv-slot-runtime/vless/v01.json > /tmp/vvv-slot-runtime/v01.log 2>&1 & V1_PID=$!
            /tmp/xray run -format=json -config /tmp/vvv-slot-runtime/vless/v02.json > /tmp/vvv-slot-runtime/v02.log 2>&1 & V2_PID=$!
            /tmp/sing-box run -c /tmp/vvv-slot-runtime/hy2/h01.json > /tmp/vvv-slot-runtime/h01.log 2>&1 & H1_PID=$!
            sleep 3
            kill -0 "$V1_PID"; kill -0 "$V2_PID"; kill -0 "$H1_PID"
            ss -H -lntp 'sport = :22001' | grep -q "pid=${V1_PID}"
            ss -H -lntp 'sport = :22002' | grep -q "pid=${V2_PID}"
            ss -H -lntp 'sport = :21001' | grep -q "pid=${H1_PID}"
            kill -0 "$XRAY_MAIN_PID"; kill -0 "$SING_MAIN_PID"
            [[ "$(awk '{print $22}' /proc/${XRAY_MAIN_PID}/stat)" == "$XRAY_START" ]]
            [[ "$(awk '{print $22}' /proc/${SING_MAIN_PID}/stat)" == "$SING_START" ]]

            kill "$V1_PID" "$H1_PID"
            wait "$V1_PID" "$H1_PID" 2>/dev/null || true
            V1_PID=; H1_PID=
            sleep 2
            kill -0 "$XRAY_MAIN_PID"; kill -0 "$SING_MAIN_PID"
            [[ "$(awk '{print $22}' /proc/${XRAY_MAIN_PID}/stat)" == "$XRAY_START" ]]
            [[ "$(awk '{print $22}' /proc/${SING_MAIN_PID}/stat)" == "$SING_START" ]]

            /tmp/xray run -format=json -config /tmp/vvv-slot-runtime/vless/v01.json > /tmp/vvv-slot-runtime/v01-replacement.log 2>&1 & V1_PID=$!
            /tmp/sing-box run -c /tmp/vvv-slot-runtime/hy2/h01.json > /tmp/vvv-slot-runtime/h01-replacement.log 2>&1 & H1_PID=$!
            sleep 3
            kill -0 "$V1_PID"; kill -0 "$H1_PID"
            kill -0 "$XRAY_MAIN_PID"; kill -0 "$SING_MAIN_PID"
            [[ "$(awk '{print $22}' /proc/${XRAY_MAIN_PID}/stat)" == "$XRAY_START" ]]
            [[ "$(awk '{print $22}' /proc/${SING_MAIN_PID}/stat)" == "$SING_START" ]]

            ps -o pid,ppid,rss,etime,cmd -p "$XRAY_MAIN_PID,$SING_MAIN_PID,$V1_PID,$V2_PID,$H1_PID"
            echo "xray_main_pid=${XRAY_MAIN_PID} start=${XRAY_START}"
            echo "sing_main_pid=${SING_MAIN_PID} start=${SING_START}"
            echo 'main PIDs and process start times remained unchanged across slot start, stop, and replacement'
          } > validation/runtime-slot-pid-audit.log 2>&1
      - name: Publish runtime audit
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'status=%s\n' "$RUNTIME_OUTCOME" >> validation/runtime-slot-pid-audit.log
          git add validation/runtime-slot-pid-audit.log
          git commit -m "Record live slot PID preservation audit"
          git push
          [[ "$RUNTIME_OUTCOME" == success ]]
