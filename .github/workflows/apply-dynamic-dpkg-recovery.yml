name: Apply dynamic dpkg recovery

on:
  push:
    branches: [agent/dynamic-dpkg-update-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamic-dpkg-update-recovery
      - name: Patch dynamic dpkg recovery
        run: python3 tools/apply_dynamic_dpkg_recovery_v3.py
      - name: Run focused regression
        run: python3 tests/test_interrupted_dpkg_repair.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh core-src/host.sh core-src/landing.sh core-src/center_install.sh tests/test_interrupted_dpkg_repair.py
          git diff --cached --quiet && exit 0
          git commit -m "Scale dpkg fragment recovery to actual update count"
          git push
