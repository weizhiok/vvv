name: Publish production-ready branch
on:
  push:
    paths:
      - 'trigger-production-ready.txt'
concurrency:
  group: publish-production-ready-branch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - run: bash tools/publish_ready_branch.sh
