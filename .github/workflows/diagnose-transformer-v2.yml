name: Diagnose corrected VVV transformer
on:
  push:
    paths:
      - '.github/workflows/diagnose-transformer-v2.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture text results
        shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/v2diag
          r=validation/transformer-v2-diagnostic.txt
          : >"$r"
          cat .staging-refactor/prepare.v2.gz.part0{0,1,2,3,4} >/tmp/v2diag/source.b64
          echo "b64_sha=$(sha256sum /tmp/v2diag/source.b64|awk '{print $1}')" >>"$r"
          base64 -d /tmp/v2diag/source.b64 >/tmp/v2diag/source.gz 2>/tmp/v2diag/decode.err; echo "decode_exit=$?" >>"$r"
          gzip -dc /tmp/v2diag/source.gz >/tmp/v2diag/prepare.py 2>/tmp/v2diag/gzip.err; echo "gzip_exit=$?" >>"$r"
          echo "source_sha=$(sha256sum /tmp/v2diag/prepare.py|awk '{print $1}')" >>"$r"
          python3 -m py_compile /tmp/v2diag/prepare.py 2>/tmp/v2diag/compile.err; echo "compile_exit=$?" >>"$r"; sed 's/^/compile_error=/' /tmp/v2diag/compile.err >>"$r"
          cp core-src/host.sh /tmp/v2diag/host.sh; cp core-src/landing.sh /tmp/v2diag/landing.sh; cp core-src/center_install.sh /tmp/v2diag/center.sh
          python3 /tmp/v2diag/prepare.py /tmp/v2diag/host.sh /tmp/v2diag/landing.sh /tmp/v2diag/center.sh 2>/tmp/v2diag/transform.err; echo "transform_exit=$?" >>"$r"; sed 's/^/transform_error=/' /tmp/v2diag/transform.err >>"$r"
          bash -n /tmp/v2diag/host.sh 2>/tmp/v2diag/host.err; echo "host_syntax_exit=$?" >>"$r"; sed 's/^/host_error=/' /tmp/v2diag/host.err >>"$r"
          sh -n /tmp/v2diag/landing.sh 2>/tmp/v2diag/landing.err; echo "landing_syntax_exit=$?" >>"$r"; sed 's/^/landing_error=/' /tmp/v2diag/landing.err >>"$r"
          for p in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do grep -q "$p" /tmp/v2diag/host.sh; echo "feature_${p// /_}=$?" >>"$r"; done
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/transformer-v2-diagnostic.txt
          git commit -m 'Record corrected transformer diagnostics'
          git push
