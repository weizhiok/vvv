name: Fix IPv4 manager runtime
on:
  push:
    branches: [agent/fix-ipv4-manager-runtime]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ipv4-manager-runtime
      - name: Apply focused manager runtime fix
        run: python3 tools/fix_ipv4_manager_runtime.py
      - name: Verify generated manager source
        run: |
          bash -n core-src/host.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('core-src/host.sh').read_text(encoding='utf-8')
          start="cat > /usr/local/sbin/jp-relay-manager <<'JP_RELAY_JPR3_MANAGER_EOF'\n"
          assert text.count(start)==1
          manager=text.split(start,1)[1].split('\nJP_RELAY_JPR3_MANAGER_EOF',1)[0]
          assert 'IPV4_ONLY_MODULE=/usr/local/lib/vvv/ipv4_only.sh' in manager
          assert 'source "$IPV4_ONLY_MODULE"' in manager
          assert manager.index('source "$IPV4_ONLY_MODULE"') < manager.index('vvv_enforce_ipv4_only')
          Path('/tmp/jp-relay-manager').write_text(manager,encoding='utf-8')
          PY
          bash -n /tmp/jp-relay-manager
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/host.sh
          git diff --cached --quiet && exit 0
          git commit -m "Load IPv4-only runtime in generated relay manager"
          git push
