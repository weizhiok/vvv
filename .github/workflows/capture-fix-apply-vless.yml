name: Capture fixed VLESS slot application
on:
  push:
    paths:
      - '.github/workflows/capture-fix-apply-vless.yml'
permissions:
  actions: read
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture latest run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p validation
          run_id="$(gh run list --repo weizhiok/vvv --workflow fix-and-apply-vless-slots.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          {
            echo "run_id=$run_id"
            gh run view "$run_id" --repo weizhiok/vvv --json name,status,conclusion,jobs
            echo '===== failed logs ====='
            gh run view "$run_id" --repo weizhiok/vvv --log-failed || true
          } > validation/fix-apply-vless.txt 2>&1
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/fix-apply-vless.txt
          git commit -m 'Record fixed VLESS slot application'
          git push
