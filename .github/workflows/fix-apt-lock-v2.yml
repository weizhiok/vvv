name: Complete APT lock patch

on:
  push:
    paths:
      - '.github/workflows/fix-apt-lock-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch every apt-get invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('vvv-install.sh'),
              Path('core-src/host.sh'),
              Path('core-src/landing.sh'),
              Path('core-src/center_install.sh'),
          ]
          command_re = re.compile(r'\b(?:update|install|upgrade|dist-upgrade|full-upgrade)\b')
          apt_re = re.compile(r'(?<![A-Za-z0-9_-])apt-get')
          replacement = 'apt-get -o DPkg::Lock::Timeout=600 -o Acquire::Retries=5'
          results = []
          remaining = []
          total = 0

          for path in targets:
              output = []
              count = 0
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(keepends=True), 1):
                  if apt_re.search(line) and command_re.search(line) and 'DPkg::Lock::Timeout=600' not in line:
                      line, changed = apt_re.subn(replacement, line, count=1)
                      count += changed
                  output.append(line)
              text = ''.join(output)
              path.write_text(text, encoding='utf-8')
              total += count
              results.append(f'{path}: replacements={count}')

              for number, line in enumerate(text.splitlines(), 1):
                  if apt_re.search(line) and command_re.search(line) and 'DPkg::Lock::Timeout=600' not in line:
                      remaining.append(f'{path}:{number}:{line.strip()}')

          if remaining:
              raise SystemExit('仍有 APT 命令未修复：\n' + '\n'.join(remaining))

          Path('validation').mkdir(exist_ok=True)
          Path('validation/apt-lock.txt').write_text(
              'status=ok\n'
              'method=DPkg::Lock::Timeout\n'
              'timeout_seconds=600\n'
              'download_retries=5\n'
              f'total_new_replacements={total}\n' + '\n'.join(results) + '\n',
              encoding='utf-8',
          )
          PY

          bash -n vvv-install.sh
          bash -n core-src/host.sh
          bash -n core-src/center_install.sh
          bash -n core-src/register_sync.sh
          bash -n core-src/vvv_manager.sh
          sh -n core-src/landing.sh
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh core-src/host.sh core-src/landing.sh core-src/center_install.sh validation/apt-lock.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply APT lock timeout to all installers'
          git push
