name: Measure corrected transformer parts
on:
  push:
    paths:
      - '.github/workflows/measure-transformer-v2-parts.yml'
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p validation
          {
            for f in .staging-refactor/prepare.v2.gz.part0{0,1,2,3,4}; do
              printf '%s size=' "$f"; wc -c <"$f"
              printf '%s sha=' "$f"; sha256sum "$f"|awk '{print $1}'
            done
          } > validation/transformer-v2-parts.txt
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/transformer-v2-parts.txt
          git commit -m 'Record corrected transformer part hashes'
          git push
