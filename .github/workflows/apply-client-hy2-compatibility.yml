name: Apply client HY2 compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-client-hy2-compatibility.yml'
      - 'tools/client-format-patch/**'
      - 'core-src/client_adapters.py'
      - 'core-src/client_package_renderer.py'
      - 'core-src/client_local_renderer.py'
      - 'core-src/sub_center.py'
      - 'tests/test_client_port_hopping.py'
      - 'tests/test_client_single_node_subscription.py'
      - 'tests/conformance.py'
permissions:
  contents: write
concurrency:
  group: apply-client-hy2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compatibility patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -q '^VERSION = 5$' core-src/client_adapters.py; then
            cat tools/client-format-patch/part-*.b64 | tr -d '\n ' | base64 -d | gzip -d > /tmp/apply_client_formats.py
            sed -i 's|ROOT = Path(__file__).resolve().parents\[1\]|ROOT = Path.cwd()|' /tmp/apply_client_formats.py
            python3 -m py_compile /tmp/apply_client_formats.py
            python3 /tmp/apply_client_formats.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/conformance.py')
          text = path.read_text(encoding='utf-8')
          old_bandwidth = "    require(\"node.get('limit_mbps')\" in adapter, '客户端模板仍固定写死 50M')\n"
          new_bandwidth = (
              "    require('CLIENT_UP_MBPS = 30' in adapter and 'CLIENT_DOWN_MBPS = 50' in adapter, "
              "'客户端上下行带宽没有独立设置为 30/50 Mbps')\n"
              "    require(\"node.get('limit_mbps')\" not in adapter, '客户端模板仍错误复用服务器硬限速')\n"
          )
          if old_bandwidth in text:
              text = text.replace(old_bandwidth, new_bandwidth, 1)
          elif new_bandwidth not in text:
              raise SystemExit('tests/conformance.py bandwidth contract not found')
          old_clients = '''        rendered = adapters.render('clash', center.all_nodes())
          require(adapters.render('nekobox', center.all_nodes()) == rendered, 'NekoBox 没有使用 Clash Meta 格式')
          require('65 Mbps' in rendered, 'HY2 客户端模板未使用节点限速')
          require('ports: "443,20000-50000"' in rendered and 'hop-interval: 30' in rendered,
                  'Mihomo 客户端模板缺少 HY2 端口跳跃')
          loon = adapters.render('loon', center.all_nodes())
          require('server-ports="443,20000-50000"' in loon and 'block-quic=true' in loon,
                  'Loon 客户端模板缺少 HY2 端口跳跃')
          shadow = base64.b64decode(adapters.render('shadowrocket', center.all_nodes())).decode()
          require('vless://' in shadow and 'hysteria2://' in shadow, '客户端订阅渲染不完整')
          '''
          new_clients = '''        rendered = adapters.render('clash', center.all_nodes())
          nekobox = adapters.render('nekobox', center.all_nodes())
          require(rendered.startswith('proxies:\n') and nekobox.startswith('proxies:\n'),
                  'Clash/NekoBox 没有使用节点型 Clash Meta 格式')
          require('proxy-groups:' not in rendered and 'rules:' not in rendered,
                  'Clash 节点订阅仍包含策略组或规则')
          require('up: "30 Mbps"' in rendered and 'down: "50 Mbps"' in rendered,
                  'Clash 客户端带宽不是 30/50 Mbps')
          require('ports: "443,20000-50000"' in rendered and 'hop-interval: "20-30"' in rendered,
                  'Mihomo 客户端模板缺少随机 HY2 端口跳跃')
          require('up: "30 Mbps"' in nekobox and 'down: "50 Mbps"' in nekobox and 'hop-interval: 30' in nekobox,
                  'NekoBox 客户端模板缺少固定 30 秒和 30/50 Mbps')
          require(nekobox != rendered, 'NekoBox 与 Clash 的跳跃间隔仍被错误共用')
          loon = adapters.render('loon', center.all_nodes())
          require('server-ports="443,20000-50000"' in loon and 'hop-interval=30' in loon and
                  'block-quic=true' in loon and 'download-bandwidth=50' in loon,
                  'Loon 客户端模板缺少 HY2 端口跳跃或下载带宽')
          shadow = base64.b64decode(adapters.render('shadowrocket', center.all_nodes())).decode()
          require('vless://' in shadow and 'hysteria2://' in shadow, '客户端订阅渲染不完整')
          for field in ('peer=', 'fastopen=1', 'upmbps=30', 'downmbps=50', 'mport=443,20000-50000'):
              require(field in shadow, f'Shadowrocket HY2 缺少参数：{field}')
          '''
          if old_clients in text:
              text = text.replace(old_clients, new_clients, 1)
          elif new_clients not in text:
              raise SystemExit('tests/conformance.py client renderer contract not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax and client contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/client_package_renderer.py core-src/client_local_renderer.py core-src/sub_center.py
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/conformance.py
      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-src/client_adapters.py core-src/client_package_renderer.py core-src/client_local_renderer.py core-src/sub_center.py tests/test_client_port_hopping.py tests/test_client_single_node_subscription.py tests/conformance.py
          if ! git diff --cached --quiet; then
            git commit -m 'Improve HY2 client format compatibility'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
