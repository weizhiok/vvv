name: Apply client HY2 compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-client-hy2-compatibility.yml'
      - 'core-src/client_adapters.py'
      - 'core-src/client_package_renderer.py'
      - 'core-src/client_local_renderer.py'
      - 'core-src/sub_center.py'
      - 'tests/test_client_port_hopping.py'
      - 'tests/test_client_single_node_subscription.py'
permissions:
  contents: write
concurrency:
  group: apply-client-hy2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compatibility patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -q '^VERSION = 5$' core-src/client_adapters.py; then
            printf '%s' '' | base64 -d | gzip -d > /tmp/apply_client_formats.py
            python3 /tmp/apply_client_formats.py
          fi
      - name: Validate syntax and client contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/client_package_renderer.py core-src/client_local_renderer.py core-src/sub_center.py
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/conformance.py
      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-src/client_adapters.py core-src/client_package_renderer.py core-src/client_local_renderer.py core-src/sub_center.py tests/test_client_port_hopping.py tests/test_client_single_node_subscription.py
          if ! git diff --cached --quiet; then
            git commit -m 'Improve HY2 client format compatibility'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
