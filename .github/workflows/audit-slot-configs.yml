name: Audit generated isolated slot configurations
on:
  push:
    paths:
      - '.github/workflows/audit-slot-configs.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate configuration fixtures
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation /tmp/vvv-slot-audit
          {
            set -Eeuxo pipefail
            python3 -m py_compile tools/fix_transform_replacement_escapes.py
            python3 tools/fix_transform_replacement_escapes.py
            python3 -m py_compile src/prepare.py
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            python3 -m py_compile tools/extract_manager_library.py tools/build_slot_audit_fixture.py
            python3 tools/extract_manager_library.py /tmp/host.sh /tmp/jp-relay-manager-lib.sh
            bash -n /tmp/jp-relay-manager-lib.sh

            XRAY_VERSION="$(sed -n 's/^XRAY_FALLBACK_VERSION="\([^"]*\)"/\1/p' /tmp/jp-relay-manager-lib.sh | head -n1)"
            SING_VERSION="$(sed -n 's/^SING_BOX_FALLBACK_VERSION="\([^"]*\)"/\1/p' /tmp/jp-relay-manager-lib.sh | head -n1)"
            [[ -n "$XRAY_VERSION" && -n "$SING_VERSION" ]]
            curl -fL --retry 5 --retry-all-errors "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
            unzip -q /tmp/xray.zip xray -d /tmp/xray-unpack
            install -m755 /tmp/xray-unpack/xray /tmp/xray
            curl -fL --retry 5 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz" -o /tmp/sing-box.tgz
            tar -xzf /tmp/sing-box.tgz -C /tmp
            install -m755 "/tmp/sing-box-${SING_VERSION}-linux-amd64/sing-box" /tmp/sing-box

            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -nodes -days 7 \
              -subj '/CN=jp-hy2.jp-relay.local' -addext 'subjectAltName=DNS:jp-hy2.jp-relay.local' \
              -keyout /tmp/vvv-slot-audit/server.key -out /tmp/vvv-slot-audit/server.crt >/dev/null 2>&1

            source /tmp/jp-relay-manager-lib.sh
            XRAY=/tmp/xray
            SING_BOX=/tmp/sing-box
            HY2_LIMIT_MBPS=50
            parse_x25519_keys "$($XRAY x25519)"
            export VVV_AUDIT_REALITY_PRIVATE="$GENERATED_PRIVATE_KEY"
            export VVV_AUDIT_REALITY_PUBLIC="$GENERATED_PUBLIC_KEY"
            parse_x25519_keys "$($XRAY x25519)"
            export VVV_AUDIT_REMOTE_PUBLIC="$GENERATED_PUBLIC_KEY"
            export VVV_AUDIT_CERT_PATH=/tmp/vvv-slot-audit/server.crt
            export VVV_AUDIT_KEY_PATH=/tmp/vvv-slot-audit/server.key
            export AUDIT_DIR=/tmp/vvv-slot-audit
            python3 tools/build_slot_audit_fixture.py

            build_xray_config /tmp/vvv-slot-audit/state-empty.json /tmp/vvv-slot-audit/xray-empty.json
            build_xray_config /tmp/vvv-slot-audit/state-active.json /tmp/vvv-slot-audit/xray-active.json
            cmp /tmp/vvv-slot-audit/xray-empty.json /tmp/vvv-slot-audit/xray-active.json
            build_sing_config /tmp/vvv-slot-audit/state-empty.json /tmp/vvv-slot-audit/sing-empty.json
            build_sing_config /tmp/vvv-slot-audit/state-active.json /tmp/vvv-slot-audit/sing-active.json
            cmp /tmp/vvv-slot-audit/sing-empty.json /tmp/vvv-slot-audit/sing-active.json

            mkdir -p /tmp/vvv-slot-audit/vless-empty /tmp/vvv-slot-audit/vless-active /tmp/vvv-slot-audit/hy2-empty /tmp/vvv-slot-audit/hy2-active
            build_vless_slot_configs /tmp/vvv-slot-audit/state-empty.json /tmp/vvv-slot-audit/vless-empty
            build_vless_slot_configs /tmp/vvv-slot-audit/state-active.json /tmp/vvv-slot-audit/vless-active
            build_hy2_slot_configs /tmp/vvv-slot-audit/state-empty.json /tmp/vvv-slot-audit/hy2-empty
            build_hy2_slot_configs /tmp/vvv-slot-audit/state-active.json /tmp/vvv-slot-audit/hy2-active
            [[ "$(find /tmp/vvv-slot-audit/vless-empty -type f | wc -l)" -eq 0 ]]
            [[ "$(find /tmp/vvv-slot-audit/hy2-empty -type f | wc -l)" -eq 0 ]]
            [[ "$(find /tmp/vvv-slot-audit/vless-active -name '*.json' | wc -l)" -eq 2 ]]
            [[ "$(find /tmp/vvv-slot-audit/hy2-active -name '*.json' | wc -l)" -eq 1 ]]
            [[ -f /tmp/vvv-slot-audit/vless-active/v01.json ]]
            [[ -f /tmp/vvv-slot-audit/vless-active/v02.json ]]
            [[ -f /tmp/vvv-slot-audit/hy2-active/h01.json ]]

            /tmp/xray run -test -format=json -config /tmp/vvv-slot-audit/xray-active.json
            for cfg in /tmp/vvv-slot-audit/vless-active/*.json; do
              /tmp/xray run -test -format=json -config "$cfg"
            done
            /tmp/sing-box check -c /tmp/vvv-slot-audit/sing-active.json
            for cfg in /tmp/vvv-slot-audit/hy2-active/*.json; do
              /tmp/sing-box check -c "$cfg"
            done

            printf 'xray_version=%s\n' "$XRAY_VERSION"
            printf 'sing_box_version=%s\n' "$SING_VERSION"
            sha256sum /tmp/vvv-slot-audit/xray-empty.json /tmp/vvv-slot-audit/xray-active.json
            sha256sum /tmp/vvv-slot-audit/sing-empty.json /tmp/vvv-slot-audit/sing-active.json
            jq -c '{inbounds:(.inbounds|length),outbounds:(.outbounds|length),rules:(.routing.rules|length)}' /tmp/vvv-slot-audit/xray-active.json
            jq -c '{inbounds:(.inbounds|length),outbounds:(.outbounds|length),rules:(.route.rules|length)}' /tmp/vvv-slot-audit/sing-active.json
            find /tmp/vvv-slot-audit/vless-active /tmp/vvv-slot-audit/hy2-active -maxdepth 1 -type f -printf '%p\n' | sort
          } > validation/slot-config-audit.log 2>&1
      - name: Publish audit
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'status=%s\n' "$AUDIT_OUTCOME" >> validation/slot-config-audit.log
          git add validation/slot-config-audit.log
          if [[ "$AUDIT_OUTCOME" == success ]]; then
            git add src/prepare.py
            git commit -m "Fix generated slot config escaping and validate cores"
          else
            git commit -m "Record isolated slot configuration audit failure"
          fi
          git push
          [[ "$AUDIT_OUTCOME" == success ]]
