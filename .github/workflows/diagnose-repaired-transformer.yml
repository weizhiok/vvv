name: Diagnose repaired VVV transformer
on:
  push:
    paths:
      - '.github/workflows/diagnose-repaired-transformer.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and capture every result
        shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/repaired
          report=validation/refactor-repaired-diagnostic.txt
          : >"$report"
          run(){ echo "===== $1 =====" >>"$report"; shift; "$@" >>"$report" 2>&1; echo "exit=$?" >>"$report"; }
          cat .staging-refactor/prepare.good.part0{0,1,2,3,4} >/tmp/repaired/prepare.b64
          base64 -d /tmp/repaired/prepare.b64 >/tmp/repaired/prepare.py
          python3 - <<'PY' >>"$report" 2>&1
          from pathlib import Path
          p=Path('/tmp/repaired/prepare.py'); lines=p.read_text(encoding='utf-8').splitlines()
          print('line_count',len(lines))
          for n in (143,146,147,181): print(n,repr(lines[n-1]))
          lines[142]=lines[142].replace("old = ''","old = '''",1)
          lines[145]+="'"
          lines[146]=lines[146].replace("new = ''","new = '''",1)
          lines[180]="h = replace_once(h, marker, insert, '动态代理用户占用状态')"
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          echo "repair_exit=$?" >>"$report"
          run compile python3 -m py_compile /tmp/repaired/prepare.py
          cp core-src/host.sh /tmp/repaired/host.sh; cp core-src/landing.sh /tmp/repaired/landing.sh; cp core-src/center_install.sh /tmp/repaired/center.sh
          run transform python3 /tmp/repaired/prepare.py /tmp/repaired/host.sh /tmp/repaired/landing.sh /tmp/repaired/center.sh
          run host_syntax bash -n /tmp/repaired/host.sh
          run landing_syntax sh -n /tmp/repaired/landing.sh
          for p in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do echo "===== grep:$p =====" >>"$report"; grep -n "$p" /tmp/repaired/host.sh|head -3 >>"$report" 2>&1; echo "exit=$?" >>"$report"; done
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/refactor-repaired-diagnostic.txt
          git commit -m 'Record repaired transformer diagnostics'
          git push
