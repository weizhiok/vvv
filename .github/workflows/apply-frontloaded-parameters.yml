name: Apply front-loaded installer parameters
on:
  push:
    paths:
      - '.github/workflows/apply-frontloaded-parameters.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            set -Eeuxo pipefail
            python3 -m py_compile tools/frontload_host_env.py
            python3 tools/frontload_host_env.py
            bash -n core-src/host.sh
            bash -n core-src/bootstrap.sh
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            bash -n /tmp/host.sh
            sh -n /tmp/landing.sh
            bash -n /tmp/center.sh
            grep -q 'preset_mode="${VVV_PROXY_MODE:-}"' /tmp/host.sh
            grep -q 'preset_port="${VVV_PROXY_PORT:-}"' /tmp/host.sh
            grep -q 'ask_proxy_parameters; ask_center_parameters' core-src/bootstrap.sh
            grep -q 'bash "$BASE_DIR/register_sync.sh" center-relay "$code"' core-src/bootstrap.sh
            ! grep -q 'register_sync.sh" all ' core-src/bootstrap.sh
            python3 - <<'PY'
          from pathlib import Path
          text=Path('core-src/bootstrap.sh').read_text(encoding='utf-8')
          collect=text.index('# 真正安装前，一次性收集该角色需要的全部参数。')
          install=text.index('echo "参数已收集完毕，开始全自动安装。"')
          for token in ('ask_proxy_parameters','ask_center_parameters','ask_code code','请输入完整 JPR3 对接密钥'):
              assert text.find(token,collect,install) >= 0, token
          print('all role-specific inputs are collected before installation starts')
          PY
          } > validation/frontloaded-parameters.log 2>&1
      - name: Publish result
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'status=%s\n' "$VALIDATE_OUTCOME" >> validation/frontloaded-parameters.log
          git add validation/frontloaded-parameters.log
          if [[ "$VALIDATE_OUTCOME" == success ]]; then
            git add core-src/host.sh
            git commit -m 'Front-load unified installer parameters'
          else
            git commit -m 'Record front-loaded parameter validation failure'
          fi
          git push
          [[ "$VALIDATE_OUTCOME" == success ]]
