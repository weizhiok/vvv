name: Repair and publish VVV transformer
on:
  push:
    paths:
      - '.github/workflows/repair-and-publish-transformer.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known transfer damage and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .staging-refactor/prepare.good.part0{0,1,2,3,4} >/tmp/prepare.b64
          base64 -d /tmp/prepare.b64 >/tmp/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/prepare.py')
          lines=path.read_text(encoding='utf-8').splitlines()
          def check(n,prefix):
              if not lines[n-1].startswith(prefix):
                  raise SystemExit(f'line {n} mismatch: {lines[n-1]!r}')
          check(143,"old = ''        --arg client_uuid")
          lines[142]=lines[142].replace("old = ''","old = '''",1)
          if not lines[145].endswith("\"''"):
              raise SystemExit(f'line 146 mismatch: {lines[145]!r}')
          lines[145] += "'"
          check(147,"new = ''        --arg client_uuid")
          lines[146]=lines[146].replace("new = ''","new = '''",1)
          check(181,"h = replace_once(h, marker, insert,")
          lines[180]="h = replace_once(h, marker, insert, '动态代理用户占用状态')"
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 -m py_compile /tmp/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
          cp core-src/host.sh /tmp/host.sh; cp core-src/landing.sh /tmp/landing.sh; cp core-src/center_install.sh /tmp/center.sh
          python3 /tmp/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          bash -n /tmp/host.sh
          sh -n /tmp/landing.sh
          for f in core-src/center_install.sh core-src/register_sync.sh core-src/vvv_manager.sh core-src/rclone_manager.sh core-src/qr_helper.sh src/bootstrap.sh vvv-install.sh; do bash -n "$f"; done
          grep -q 'reserve_users' /tmp/host.sh
          grep -q 'api-in' /tmp/host.sh
          grep -q 'api adrules' /tmp/host.sh
          grep -q 'xray 主进程未重启' /tmp/host.sh
          ! grep -q 'salamander-password={loon_q' /tmp/host.sh
          ! grep -q 'salamander-password={loon_q' /tmp/landing.sh
          install -m755 /tmp/prepare.py src/prepare.py
          mkdir -p validation
          cat > validation/refactor-v3.txt <<EOF
          status=ok
          transformer_sha256=$(sha256sum src/prepare.py|awk '{print $1}')
          roles=center-relay,center,relay,landing,direct
          subscription_paths=c,qx,ln,sr,v2
          loon_salamander_quotes=removed
          v2rayng_hy2=separate_without_pin
          qr_top_quiet_zone=enabled
          backup=event-driven-only
          cross_host_backup=removed
          cloud_backup=rclone-optional
          xray_line_changes=api-hot-load
          shell=ok
          python=ok
          EOF
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/prepare.py validation/refactor-v3.txt
          git commit -m 'Publish validated all in one transformer'
          git push
