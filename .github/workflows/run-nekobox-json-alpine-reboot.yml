name: Validate NekoBox JSON and Alpine reboot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-nekobox-json-alpine-reboot.yml'
      - 'tools/make_alpine_reboot_posix.py'
      - 'tools/scope_posix_reboot_test.py'
permissions:
  contents: write
concurrency:
  group: nekobox-json-alpine-reboot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make Alpine helper POSIX
        run: |
          python3 tools/make_alpine_reboot_posix.py
          python3 tools/scope_posix_reboot_test.py
      - name: Validate source and contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/sub_center.py
          bash -n core-src/bootstrap.sh
          bash -n core-src/host.sh
          bash -n tests/final_runtime_validation.sh
          python3 - <<'PY_POSIX_HELPER'
          from pathlib import Path
          import subprocess, tempfile
          text = Path('core-src/host.sh').read_text(encoding='utf-8')
          body = text.split("cat > /usr/local/lib/vvv/daily-reboot.sh <<'EOF_DAILY_REBOOT'", 1)[1].split('EOF_DAILY_REBOOT', 1)[0].lstrip('\n')
          with tempfile.NamedTemporaryFile('w', encoding='utf-8', suffix='.sh') as handle:
              handle.write(body)
              handle.flush()
              subprocess.run(['/bin/sh', '-n', handle.name], check=True)
          PY_POSIX_HELPER
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/client_upgrade_isolation_validation.py
          python3 tests/test_install_reboot_guard.py
          python3 tests/test_hy2_port_hopping.py
          python3 tests/conformance.py
      - name: Commit verified POSIX helper
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-src/host.sh tests/test_install_reboot_guard.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make Alpine reboot helper POSIX sh'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
