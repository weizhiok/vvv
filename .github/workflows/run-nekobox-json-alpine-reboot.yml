name: Apply NekoBox JSON and Alpine reboot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-nekobox-json-alpine-reboot.yml'
      - 'tools/apply_nekobox_json_alpine_reboot.py'
      - 'tools/fix_nekobox_json_alpine_patch.py'
permissions:
  contents: write
concurrency:
  group: nekobox-json-alpine-reboot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply confirmed changes
        run: |
          python3 tools/apply_nekobox_json_alpine_reboot.py
          python3 tools/fix_nekobox_json_alpine_patch.py
      - name: Validate source and contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/sub_center.py
          bash -n core-src/bootstrap.sh
          bash -n core-src/host.sh
          bash -n tests/final_runtime_validation.sh
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/client_upgrade_isolation_validation.py
          python3 tests/test_install_reboot_guard.py
          python3 tests/test_hy2_port_hopping.py
          python3 tests/conformance.py
      - name: Commit verified production changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core-src/client_adapters.py \
            core-src/bootstrap.sh \
            core-src/host.sh \
            tests/test_client_port_hopping.py \
            tests/test_client_single_node_subscription.py \
            tests/test_install_reboot_guard.py \
            tests/conformance.py \
            tests/final_runtime_validation.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Use NekoBox sing-box JSON and support Alpine reboot'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
