name: Fix runtime validation USER environment
on:
  push:
    paths:
      - '.github/workflows/fix-runtime-test-user.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set stable USER value in test script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/final_runtime_validation.sh')
          s=p.read_text(encoding='utf-8')
          old='set -Eeuo pipefail\numask 077\n'
          new='set -Eeuo pipefail\numask 077\nexport USER="${USER:-runner}"\n'
          if s.count(old)!=1:
              raise SystemExit('test header not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash -n tests/final_runtime_validation.sh
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/final_runtime_validation.sh
          git commit -m 'Set USER for Xray runtime validation'
          git push
