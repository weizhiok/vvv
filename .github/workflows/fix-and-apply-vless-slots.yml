name: Fix and apply VLESS slot patch
on:
  push:
    paths:
      - '.github/workflows/fix-and-apply-vless-slots.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair patch quoting
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_vless_slots.py')
          s=p.read_text(encoding='utf-8')
          if s.count("post=r'''") != 1:
              raise SystemExit('outer opening delimiter not found once')
          s=s.replace("post=r'''", 'post=r"""', 1)
          marker="\n'''\ns=s.replace(anchor,post+"
          if s.count(marker) != 1:
              raise SystemExit('outer closing delimiter not found once')
          s=s.replace(marker, '\n"""\ns=s.replace(anchor,post+', 1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile tools/patch_vless_slots.py
      - name: Apply and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/patch_vless_slots.py
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
          cp core-src/host.sh /tmp/host.sh
          cp core-src/landing.sh /tmp/landing.sh
          cp core-src/center_install.sh /tmp/center.sh
          python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          bash -n /tmp/host.sh
          sh -n /tmp/landing.sh
          grep -q 'build_vless_slot_configs' /tmp/host.sh
          grep -q 'vvv-vless-slot@' /tmp/host.sh
          grep -q 'build_hy2_slot_configs' /tmp/host.sh
          grep -q 'vvv-hy2-slot@' /tmp/host.sh
          grep -q '主 Xray PID 已保持不变' /tmp/host.sh
          grep -q '主 sing-box PID 已保持不变' /tmp/host.sh
      - name: Commit official sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/patch_vless_slots.py src/prepare.py
          git commit -m 'Use isolated VLESS and HY2 relay slots'
          git push
