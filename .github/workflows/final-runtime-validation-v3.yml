name: Final VVV runtime validation v3
on:
  push:
    paths:
      - '.github/workflows/final-runtime-validation-v3.yml'
permissions:
  contents: write
env:
  USER: runner
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq qrencode openssl curl unzip iproute2
      - name: Run runtime validation
        shell: bash
        run: |
          chmod +x tests/final_runtime_validation.sh
          tests/final_runtime_validation.sh | tee /tmp/vvv-validation.txt
      - name: Record result
        shell: bash
        run: |
          mkdir -p validation
          {
            echo "date=$(date -u +%FT%TZ)"
            tail -n 12 /tmp/vvv-validation.txt
          } > validation/final-vvv-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/final-vvv-validation.txt
          git commit -m 'Validate VVV all in one runtime'
          git push
