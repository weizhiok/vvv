name: Apply automatic landing registration
on:
  push:
    paths:
      - '.github/workflows/apply-landing-registration.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          {
            set -Eeuxo pipefail
            python3 -m py_compile tools/patch_landing_registration.py
            python3 tools/patch_landing_registration.py
            bash -n core-src/bootstrap.sh
            sh -n core-src/landing.sh
            grep -q 'python3' core-src/landing.sh
            grep -q 'jpr_registration_code' core-src/bootstrap.sh
            grep -q 'register_sync.sh" landing "$code"' core-src/bootstrap.sh
            python3 - <<'PY'
          import base64,hashlib,json,subprocess
          payload={'schema':3,'subscription_registration_code':'VVV1.audit-code'}
          raw=json.dumps(payload,separators=(',',':')).encode()
          key='JPR3.'+base64.urlsafe_b64encode(raw).decode().rstrip('=')+'.'+hashlib.sha256(raw).hexdigest()[:20]
          script='source core-src/bootstrap.sh'
          # Extract only the helper to avoid executing the installer body.
          text=open('core-src/bootstrap.sh',encoding='utf-8').read()
          start=text.index('jpr_registration_code(){')
          end=text.index('\nshow_parameter_summary(){',start)
          helper=text[start:end]
          command=helper+'\njpr_registration_code '+subprocess.list2cmdline([key])
          out=subprocess.check_output(['bash','-c',command],text=True).strip()
          assert out=='VVV1.audit-code',out
          print('JPR3 subscription registration code extraction passed')
          PY
            cp core-src/host.sh /tmp/host.sh
            cp core-src/landing.sh /tmp/landing.sh
            cp core-src/center_install.sh /tmp/center.sh
            python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
            bash -n /tmp/host.sh
            sh -n /tmp/landing.sh
            bash -n /tmp/center.sh
          } > validation/landing-registration.log 2>&1
      - name: Publish result
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'status=%s\n' "$VALIDATE_OUTCOME" >> validation/landing-registration.log
          git add validation/landing-registration.log
          if [[ "$VALIDATE_OUTCOME" == success ]]; then
            git add core-src/bootstrap.sh core-src/landing.sh
            git commit -m 'Auto-register landing hosts from JPR3 metadata'
          else
            git commit -m 'Record landing registration validation failure'
          fi
          git push
          [[ "$VALIDATE_OUTCOME" == success ]]
