name: Publish no-restart HY2 slot transformer
on:
  push:
    paths:
      - '.github/workflows/publish-hy2-slot-transformer.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified patch programs
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'b8eb4ce5d0fea38e9b197c0d552a88f174d11247de08646c2df044e6de9f1380  src/prepare.py' | sha256sum -c -
          echo '60d4a3127a1f251d2bea8f9246cb168baeeed193518bf0dd009bd984b008022c  .staging-refactor/patch-hy2-static.gz.b64' | sha256sum -c -
          base64 -d .staging-refactor/patch-hy2-static.gz.b64 >/tmp/static.gz
          echo 'df6d734a1b3057cc66487f8f64afc186565cb5736d5558814431ccaa09a809a4  /tmp/static.gz' | sha256sum -c -
          gzip -t /tmp/static.gz; gzip -dc /tmp/static.gz >/tmp/static.py
          echo '4cde55c9f7d35acd077f90a4b3cd63cf43995b089344eab74deaf4d7ee83709f  /tmp/static.py' | sha256sum -c -
          echo '08e8a00bd616cd514cda566c3bb944e5fa9b938e4ef43ce035211be8651fe75d  .staging-refactor/patch-hy2-runtime.gz.b64' | sha256sum -c -
          base64 -d .staging-refactor/patch-hy2-runtime.gz.b64 >/tmp/runtime.gz
          echo 'b41913494e5a1b11bfd73c3161340f08422b36339df72eb990605f5eae968463  /tmp/runtime.gz' | sha256sum -c -
          gzip -t /tmp/runtime.gz; gzip -dc /tmp/runtime.gz >/tmp/runtime.py
          echo '5d9b994fffe3d97e45ad13eff221deff39c3618d41a4315c1b16ad5aec70e267  /tmp/runtime.py' | sha256sum -c -
          python3 -m py_compile /tmp/static.py /tmp/runtime.py
      - name: Apply patches and validate transformed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 /tmp/static.py
          python3 /tmp/runtime.py
          chmod +x src/prepare.py
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py
          cp core-src/host.sh /tmp/host.sh
          cp core-src/landing.sh /tmp/landing.sh
          cp core-src/center_install.sh /tmp/center.sh
          python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          bash -n /tmp/host.sh
          sh -n /tmp/landing.sh
          grep -q 'reserve-h' /tmp/host.sh
          grep -q 'vvv-hy2-slot@.service' /tmp/host.sh
          grep -q 'sync_hy2_slot_services' /tmp/host.sh
          grep -q 'block-unused-vless' /tmp/host.sh
          grep -q 'Xray/sing-box 主进程均未重启' /tmp/host.sh
          grep -q 'cmp -s "$candidate_sing" "$SING_CFG"' /tmp/host.sh
          mkdir -p validation
          cat > validation/refactor-v4.txt <<EOF
          status=ok
          transformer_sha256=$(sha256sum src/prepare.py|awk '{print $1}')
          xray_main_restart_on_line_change=no
          sing_box_main_restart_on_line_change=no
          hy2_slot_services=enabled
          vless_unused_credentials=blocked
          transformed_host_shell=ok
          transformed_landing_shell=ok
          python=ok
          EOF
      - name: Commit transformer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/prepare.py validation/refactor-v4.txt
          git commit -m 'Keep main HY2 service alive during relay changes'
          git push
