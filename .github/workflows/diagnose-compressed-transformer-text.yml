name: Text-only compressed transformer diagnostics
on:
  push:
    paths:
      - '.github/workflows/diagnose-compressed-transformer-text.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose safely
        shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/ctext
          r=validation/compressed-transformer-text.txt
          : >"$r"
          cat .staging-refactor/prepare.gz.part0{0,1,2,3,4} >/tmp/ctext/source.b64
          echo "b64_size=$(wc -c </tmp/ctext/source.b64)" >>"$r"
          echo "b64_sha=$(sha256sum /tmp/ctext/source.b64|awk '{print $1}')" >>"$r"
          base64 -d /tmp/ctext/source.b64 >/tmp/ctext/source.gz 2>/tmp/ctext/decode.err
          echo "decode_exit=$?" >>"$r"; sed 's/^/decode_error=/' /tmp/ctext/decode.err >>"$r"
          echo "gzip_size=$(wc -c </tmp/ctext/source.gz)" >>"$r"
          echo "gzip_sha=$(sha256sum /tmp/ctext/source.gz|awk '{print $1}')" >>"$r"
          gzip -t /tmp/ctext/source.gz 2>/tmp/ctext/gzip.err
          echo "gzip_test_exit=$?" >>"$r"; sed 's/^/gzip_error=/' /tmp/ctext/gzip.err >>"$r"
          gzip -dc /tmp/ctext/source.gz >/tmp/ctext/prepare.py 2>/tmp/ctext/unzip.err
          echo "unzip_exit=$?" >>"$r"; sed 's/^/unzip_error=/' /tmp/ctext/unzip.err >>"$r"
          echo "source_size=$(wc -c </tmp/ctext/prepare.py)" >>"$r"
          echo "source_sha=$(sha256sum /tmp/ctext/prepare.py|awk '{print $1}')" >>"$r"
          python3 -m py_compile /tmp/ctext/prepare.py 2>/tmp/ctext/compile.err
          echo "compile_exit=$?" >>"$r"; sed 's/^/compile_error=/' /tmp/ctext/compile.err >>"$r"
          cp core-src/host.sh /tmp/ctext/host.sh; cp core-src/landing.sh /tmp/ctext/landing.sh; cp core-src/center_install.sh /tmp/ctext/center.sh
          python3 /tmp/ctext/prepare.py /tmp/ctext/host.sh /tmp/ctext/landing.sh /tmp/ctext/center.sh 2>/tmp/ctext/transform.err
          echo "transform_exit=$?" >>"$r"; sed 's/^/transform_error=/' /tmp/ctext/transform.err >>"$r"
          bash -n /tmp/ctext/host.sh 2>/tmp/ctext/host.err; echo "host_syntax_exit=$?" >>"$r"; sed 's/^/host_error=/' /tmp/ctext/host.err >>"$r"
          sh -n /tmp/ctext/landing.sh 2>/tmp/ctext/landing.err; echo "landing_syntax_exit=$?" >>"$r"; sed 's/^/landing_error=/' /tmp/ctext/landing.err >>"$r"
          for p in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do grep -q "$p" /tmp/ctext/host.sh; echo "feature_${p// /_}=$?" >>"$r"; done
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/compressed-transformer-text.txt
          git commit -m 'Record text-only compressed transformer diagnostics'
          git push
