name: Apply silent menu exit fix
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_silent_menu_exit_fix.py'
      - 'trigger-silent-menu-exit-fix.txt'
      - '.github/workflows/apply-silent-menu-exit-fix.yml'
permissions:
  contents: write
concurrency:
  group: apply-silent-menu-exit-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-silent-menu-exit
          fetch-depth: 0
      - name: Apply production patch
        run: python3 tools/apply_silent_menu_exit_fix.py
      - name: Verify menu regression
        run: |
          set -Eeuo pipefail
          bash -n core-src/bootstrap.sh
          python3 -m py_compile tests/conformance.py
          python3 tests/conformance.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('core-src/bootstrap.sh').read_text(encoding='utf-8')
          body = text.split('detect_installed_modules() {', 1)[1].split('\n}', 1)[0]
          assert 'return 0' in body
          assert body.rfind('return 0') > body.rfind('landing_state_valid && INST_LANDING=true')
          print('PASS missing modules cannot abort menu detection')
          PY
          work="$(mktemp -d)"
          cp core-src/host.sh "$work/host.sh"
          cp core-src/landing.sh "$work/landing.sh"
          cp core-src/center_install.sh "$work/center.sh"
          python3 src/prepare.py "$work/host.sh" "$work/landing.sh" "$work/center.sh"
          bash -n "$work/host.sh"
          sh -n "$work/landing.sh"
          bash -n "$work/center.sh"
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_silent_menu_exit_fix.py trigger-silent-menu-exit-fix.txt .github/workflows/apply-silent-menu-exit-fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Fix silent exit before install menu"
          git push origin HEAD:agent/fix-silent-menu-exit
