name: Refactor host runtime without Xray restart
on:
  push:
    paths:
      - '.github/workflows/refactor-host-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch host and landing sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          host_path=Path('core-src/host.sh')
          h=host_path.read_text(encoding='utf-8')

          # Load the shared QR renderer in the installed Bash manager.
          marker='''#!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          RUN_MODE='''
          replacement='''#!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          if [[ -r /usr/local/lib/vvv/qr_helper.sh ]]; then
            source /usr/local/lib/vvv/qr_helper.sh
          else
            vvv_print_qr(){ qrencode -t ANSIUTF8 -m 1 "$1"; }
          fi

          RUN_MODE='''
          if marker not in h: raise SystemExit('host: manager header not found')
          h=h.replace(marker,replacement,1)

          # Loon must not include quotes in the Salamander password value.
          old="salamander-password={loon_q(h['obfs_password'])}"
          if old not in h: raise SystemExit('host: loon salamander field not found')
          h=h.replace(old,"salamander-password={h['obfs_password']}")

          # Route every SSH QR through the renderer that adds a top white quiet-zone line.
          h,n=re.subn(r'qrencode -t ANSIUTF8 -m\s*1 "\$uri"', 'vvv_print_qr "$uri" || true', h)
          if n < 1: raise SystemExit('host: no QR calls replaced')

          # Generate a fixed VLESS client pool at first install. Dynamic lines allocate from this pool,
          # so the public REALITY inbound never needs replacement and active direct connections survive.
          old='''    local key_output v_private v_public short_id uuid
              uuid="$(new_uuid)"
              key_output="$("$XRAY" x25519)"'''
          new='''    local key_output v_private v_public short_id uuid reserve_json i slot_uuid slot_email
              uuid="$(new_uuid)"
              reserve_json='[]'
              for i in $(seq 1 64); do
                slot_uuid="$(new_uuid)"
                slot_email="reserve-$(printf '%02d' "$i")@relay.local"
                reserve_json="$(jq --arg slot "v$(printf '%02d' "$i")" --arg uuid "$slot_uuid" --arg email "$slot_email" '. + [{slot:$slot,uuid:$uuid,email:$email,assigned_id:null}]' <<<"$reserve_json")"
              done
              key_output="$("$XRAY" x25519)"'''
          if old not in h: raise SystemExit('host: vless init block not found')
          h=h.replace(old,new,1)
          old='''      --arg uuid "$uuid" \\
              '{reality:{private_key:$private,public_key:$public,short_id:$sid},direct_user:{uuid:$uuid,email:"jp-direct@relay.local"}}')"'''
          new='''      --arg uuid "$uuid" --argjson reserve "$reserve_json" \\
              '{reality:{private_key:$private,public_key:$public,short_id:$sid},direct_user:{uuid:$uuid,email:"jp-direct@relay.local"},reserve_users:$reserve}')"'''
          if old not in h: raise SystemExit('host: vless JSON block not found')
          h=h.replace(old,new,1)

          # The running inbound always contains the fixed pool. Assigned relay/upstream UUIDs come from it.
          old='''clients=[{"id":v["direct_user"]["uuid"],"level":0,"email":v["direct_user"]["email"],"flow":"xtls-rprx-vision"}]
          for r in relays:
              rv=r.get("vless")
              if rv:
                  clients.append({"id":rv["client_uuid"],"level":0,"email":rv["client_email"],"flow":"xtls-rprx-vision"})
          for r in upstreams:
              clients.append({"id":r["client_uuid"],"level":0,"email":r["client_email"],"flow":"xtls-rprx-vision"})'''
          new='''clients=[{"id":v["direct_user"]["uuid"],"level":0,"email":v["direct_user"]["email"],"flow":"xtls-rprx-vision"}]
          for user in v.get("reserve_users",[]):
              clients.append({"id":user["uuid"],"level":0,"email":user["email"],"flow":"xtls-rprx-vision"})'''
          if old not in h: raise SystemExit('host: xray client list block not found')
          h=h.replace(old,new,1)

          old='''cfg={"log":{"loglevel":"warning"},"inbounds":inbounds,"outbounds":outbounds,"routing":{"domainStrategy":"AsIs","rules":rules}}'''
          new='''cfg={"log":{"loglevel":"warning"},"api":{"tag":"api","listen":"127.0.0.1:10085","services":["HandlerService","RoutingService"]},"inbounds":inbounds,"outbounds":outbounds,"routing":{"domainStrategy":"AsIs","rules":rules}}'''
          if old not in h: raise SystemExit('host: xray final config not found')
          h=h.replace(old,new,1)

          # Slot allocation and orphan release helpers.
          insert_before='''prepare_add_or_overwrite() {'''
          helpers=r'''allocate_vless_slot() {
            local assigned_id="$1" slot_json
            slot_json="$(jq -c '[.vless.reserve_users[] | select(.assigned_id==null)][0] // empty' "$STATE_FILE")"
            [[ -n "$slot_json" ]] || fail "VLESS 动态线路数量已达到 64 条上限。"
            ALLOC_VLESS_SLOT="$(jq -r '.slot' <<<"$slot_json")"
            ALLOC_VLESS_UUID="$(jq -r '.uuid' <<<"$slot_json")"
            ALLOC_VLESS_EMAIL="$(jq -r '.email' <<<"$slot_json")"
            [[ -n "$ALLOC_VLESS_SLOT" && -n "$ALLOC_VLESS_UUID" && -n "$ALLOC_VLESS_EMAIL" ]] || fail "VLESS 预分配用户池损坏。"
          }

          release_orphaned_vless_slots() {
            local state_path="$1" tmp
            tmp="$(mktemp --suffix=.json /tmp/jp-slot-release.XXXXXX)"
            TMP_FILES+=("$tmp")
            python3 - "$state_path" "$tmp" <<'PY_RELEASE_SLOTS'
          import json,sys
          from pathlib import Path
          src,dst=sys.argv[1:]
          state=json.loads(Path(src).read_text(encoding='utf-8'))
          active={x.get('id') for x in state.get('relays',[])} | {x.get('id') for x in state.get('upstream_relays',[])}
          for slot in ((state.get('vless') or {}).get('reserve_users') or []):
              if slot.get('assigned_id') not in active:
                  slot['assigned_id']=None
          Path(dst).write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY_RELEASE_SLOTS
            install -m600 "$tmp" "$state_path"
          }

          '''
          if insert_before not in h: raise SystemExit('host: relay add function not found')
          h=h.replace(insert_before,helpers+insert_before,1)

          # New VPS relay: allocate its public client from the fixed pool.
          old='''      local client_uuid outbound_uuid key_output private_key public_key short_id
                test_vless="$(allocate_test_port vless)"
                client_uuid="$(new_uuid)"
                outbound_uuid="$(new_uuid)"'''
          new='''      local client_uuid client_email reserve_slot outbound_uuid key_output private_key public_key short_id
                test_vless="$(allocate_test_port vless)"
                allocate_vless_slot "$relay_id"
                client_uuid="$ALLOC_VLESS_UUID"; client_email="$ALLOC_VLESS_EMAIL"; reserve_slot="$ALLOC_VLESS_SLOT"
                outbound_uuid="$(new_uuid)"'''
          if old not in h: raise SystemExit('host: relay UUID allocation not found')
          h=h.replace(old,new,1)
          old='''        --arg client_uuid "$client_uuid" --arg email "${relay_id}@relay.local" \\
                  --arg outbound_uuid "$outbound_uuid" --arg private "$private_key" --arg public "$public_key" --arg sid "$short_id" \\
                  --arg outtag "vless-out-${relay_id}" --arg testtag "vless-test-${relay_id}" --argjson testport "$test_vless" \\
                  '{client_uuid:$client_uuid,client_email:$email,outbound_uuid:$outbound_uuid,remote_reality:{private_key:$private,public_key:$public,short_id:$sid},outbound_tag:$outtag,test_inbound_tag:$testtag,test_socks_port:$testport}')"'''
          new='''        --arg client_uuid "$client_uuid" --arg email "$client_email" --arg reserve_slot "$reserve_slot" \\
                  --arg outbound_uuid "$outbound_uuid" --arg private "$private_key" --arg public "$public_key" --arg sid "$short_id" \\
                  --arg outtag "vless-out-${relay_id}" --arg testtag "vless-test-${relay_id}" --argjson testport "$test_vless" \\
                  '{client_uuid:$client_uuid,client_email:$email,reserve_slot:$reserve_slot,outbound_uuid:$outbound_uuid,remote_reality:{private_key:$private,public_key:$public,short_id:$sid},outbound_tag:$outtag,test_inbound_tag:$testtag,test_socks_port:$testport}')"'''
          if old not in h: raise SystemExit('host: relay vless json not found')
          h=h.replace(old,new,1)
          old='''      --argjson vless "$vless_json" --argjson hy2 "$hy2_json" --arg now "$now" \\
                '.relays += [{id:$id,name:$name,remote_ip:$ip,remote_port:$port,vless:$vless,hy2:$hy2,created_at:$now,updated_at:$now}] | .updated_at=$now' \\
                "$STATE_FILE" > "$candidate"'''
          new='''      --argjson vless "$vless_json" --argjson hy2 "$hy2_json" --arg now "$now" \\
                '.relays += [{id:$id,name:$name,remote_ip:$ip,remote_port:$port,vless:$vless,hy2:$hy2,created_at:$now,updated_at:$now}] |
                 (if $vless != null then (.vless.reserve_users[] | select(.slot==$vless.reserve_slot)).assigned_id=$id else . end) |
                 .updated_at=$now' \\
                "$STATE_FILE" > "$candidate"'''
          if old not in h: raise SystemExit('host: relay candidate jq not found')
          h=h.replace(old,new,1)

          # New HTTP/SOCKS upstream: allocate from the same pool and persist the slot assignment.
          old='''    test_port="$(allocate_test_port upstream)"
              client_uuid="$(new_uuid)"
              python3 - "$STATE_FILE" "$candidate" "$upstream_id" "$node_name" "$proxy_protocol" "$protocol_label" "$host" "$port" "$username" "$password" "$client_uuid" "$test_port" "$exit_ip" "$now" <<'PY_UPSTREAM_NEW' '''].strip()
          # Avoid indentation fragility for the upstream block.
          pattern=re.compile(r'''    test_port="\$\(allocate_test_port upstream\)"\n    client_uuid="\$\(new_uuid\)"\n    python3 - "\$STATE_FILE" "\$candidate" "\$upstream_id" "\$node_name" "\$proxy_protocol" "\$protocol_label" "\$host" "\$port" "\$username" "\$password" "\$client_uuid" "\$test_port" "\$exit_ip" "\$now" <<'PY_UPSTREAM_NEW'\nimport json,sys\nfrom pathlib import Path\n\(src,dst,rid,name,proto,label,host,port,user,password,uuid,test_port,exit_ip,now\)=sys\.argv\[1:\]\n''')
          repl='''    test_port="$(allocate_test_port upstream)"
              allocate_vless_slot "$upstream_id"
              client_uuid="$ALLOC_VLESS_UUID"; client_email="$ALLOC_VLESS_EMAIL"; reserve_slot="$ALLOC_VLESS_SLOT"
              python3 - "$STATE_FILE" "$candidate" "$upstream_id" "$node_name" "$proxy_protocol" "$protocol_label" "$host" "$port" "$username" "$password" "$client_uuid" "$client_email" "$reserve_slot" "$test_port" "$exit_ip" "$now" <<'PY_UPSTREAM_NEW'
          import json,sys
          from pathlib import Path
          (src,dst,rid,name,proto,label,host,port,user,password,uuid,email,reserve_slot,test_port,exit_ip,now)=sys.argv[1:]
          '''
          h,n=pattern.subn(repl,h,count=1)
          if n!=1: raise SystemExit('host: upstream UUID allocation block not found')
          old=""" 'client_uuid':uuid,'client_email':f'{rid}@upstream.local',
           'outbound_tag':f'upstream-out-{rid}','test_inbound_tag':f'upstream-test-{rid}',"""
          new=""" 'client_uuid':uuid,'client_email':email,'reserve_slot':reserve_slot,
           'outbound_tag':f'upstream-out-{rid}','test_inbound_tag':f'upstream-test-{rid}',"""
          if old not in h: raise SystemExit('host: upstream object fields not found')
          h=h.replace(old,new,1)
          old="""s['updated_at']=now
          Path(dst).write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          PY_UPSTREAM_NEW"""
          new="""for slot in s['vless']['reserve_users']:
              if slot['slot']==reserve_slot:
                  slot['assigned_id']=rid
                  break
          s['updated_at']=now
          Path(dst).write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          PY_UPSTREAM_NEW"""
          # Replace the occurrence nearest the upstream-new heredoc only.
          pos=h.find("PY_UPSTREAM_NEW")
          tail=h[pos:]
          if old not in tail: raise SystemExit('host: upstream slot assignment position not found')
          tail=tail.replace(old,new,1); h=h[:pos]+tail

          # Include the subscription registration code in JPR3 when this host owns a center.
          old='''make_pairing_key() {
            local state_path="$1" relay_id="$2"
            python3 - "$state_path" "$relay_id" <<'PY_JPR3'
          import base64,hashlib,json,sys'''
          new='''make_pairing_key() {
            local state_path="$1" relay_id="$2" registration_code=""
            [[ ! -r /etc/vvv-sub/registration.code ]] || registration_code="$(cat /etc/vvv-sub/registration.code)"
            python3 - "$state_path" "$relay_id" "$registration_code" <<'PY_JPR3'
          import base64,hashlib,json,sys'''
          if old not in h: raise SystemExit('host: pairing key header not found')
          h=h.replace(old,new,1)
          old=''' "vless":None,"hy2":None,"issued_at":datetime.now(timezone.utc).isoformat()
          }'''
          new=''' "vless":None,"hy2":None,"subscription_registration_code":sys.argv[3] or None,
           "issued_at":datetime.now(timezone.utc).isoformat()
          }'''
          if old not in h: raise SystemExit('host: pairing payload not found')
          h=h.replace(old,new,1)

          # Hot-reset helpers and transactional candidate application. Main Xray is never restarted.
          new_apply=r'''xray_dynamic_parts() {
            local config="$1" out_dir="$2"
            mkdir -p "$out_dir"
            python3 - "$config" "$out_dir" <<'PY_XRAY_PARTS'
          import json,sys
          from pathlib import Path
          cfg=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          out=Path(sys.argv[2])
          dynamic_in=[x for x in cfg.get('inbounds',[]) if x.get('tag')!='in-vless-reality']
          dynamic_out=[x for x in cfg.get('outbounds',[]) if x.get('tag') not in ('direct','blocked','api')]
          (out/'in.json').write_text(json.dumps({'inbounds':dynamic_in},ensure_ascii=False),encoding='utf-8')
          (out/'out.json').write_text(json.dumps({'outbounds':dynamic_out},ensure_ascii=False),encoding='utf-8')
          (out/'in.tags').write_text('\n'.join(x['tag'] for x in dynamic_in if x.get('tag'))+'\n',encoding='utf-8')
          (out/'out.tags').write_text('\n'.join(x['tag'] for x in dynamic_out if x.get('tag'))+'\n',encoding='utf-8')
          PY_XRAY_PARTS
          }

          xray_hot_reset() {
            local target="$1" union_a="$2" union_b="$3" work tag count
            work="$(mktemp -d /tmp/jp-xray-hot.XXXXXX)"; TMP_FILES+=("$work")
            xray_dynamic_parts "$target" "$work/target"
            xray_dynamic_parts "$union_a" "$work/a"
            xray_dynamic_parts "$union_b" "$work/b"
            cat "$work/a/in.tags" "$work/b/in.tags" | sort -u | while IFS= read -r tag; do
              [[ -z "$tag" ]] || "$XRAY" api rmi --server=127.0.0.1:10085 "$tag" >/dev/null 2>&1 || true
            done
            cat "$work/a/out.tags" "$work/b/out.tags" | sort -u | while IFS= read -r tag; do
              [[ -z "$tag" ]] || "$XRAY" api rmo --server=127.0.0.1:10085 "$tag" >/dev/null 2>&1 || true
            done
            count="$(jq '.inbounds|length' "$work/target/in.json")"
            (( count == 0 )) || "$XRAY" api adi --server=127.0.0.1:10085 "$work/target/in.json"
            count="$(jq '.outbounds|length' "$work/target/out.json")"
            (( count == 0 )) || "$XRAY" api ado --server=127.0.0.1:10085 "$work/target/out.json"
            "$XRAY" api adrules --server=127.0.0.1:10085 "$target"
          }

          apply_candidate_with_rollback() {
            local candidate_state="$1" delete_dir="${2:-}"
            local old_state old_xray old_sing candidate_xray candidate_sing xray_pid sing_changed=0 ok=1
            old_state="$(mktemp --suffix=.json /tmp/jp-old-state.XXXXXX)"
            old_xray="$(mktemp --suffix=.json /tmp/jp-old-xray.XXXXXX)"
            old_sing="$(mktemp --suffix=.json /tmp/jp-old-sing.XXXXXX)"
            candidate_xray="$(mktemp --suffix=.json /tmp/jp-new-xray.XXXXXX)"
            candidate_sing="$(mktemp --suffix=.json /tmp/jp-new-sing.XXXXXX)"
            TMP_FILES+=("$old_state" "$old_xray" "$old_sing" "$candidate_xray" "$candidate_sing")
            release_orphaned_vless_slots "$candidate_state"
            cp -a "$STATE_FILE" "$old_state"
            cp -a "$XRAY_CFG" "$old_xray"
            [[ ! -f "$SING_CFG" ]] || cp -a "$SING_CFG" "$old_sing"
            build_xray_config "$candidate_state" "$candidate_xray"
            "$XRAY" run -test -format=json -config "$candidate_xray"
            if mode_has_hy2 "$(jq -r '.protocol_mode' "$candidate_state")"; then
              build_sing_config "$candidate_state" "$candidate_sing"
              "$SING_BOX" check -c "$candidate_sing"
              cmp -s "$candidate_sing" "$SING_CFG" || sing_changed=1
            fi
            xray_pid="$(systemctl show -p MainPID --value xray)"
            "$XRAY" api inbounduser --server=127.0.0.1:10085 -tag=in-vless-reality >/dev/null
            if ! xray_hot_reset "$candidate_xray" "$old_xray" "$candidate_xray"; then
              xray_hot_reset "$old_xray" "$old_xray" "$candidate_xray" || true
              fail "Xray API 热更新失败，运行中的旧配置已恢复。"
              return 1
            fi
            install -o root -g root -m600 "$candidate_state" "$STATE_FILE"
            install -o root -g xray -m640 "$candidate_xray" "$XRAY_CFG"
            if (( sing_changed == 1 )); then
              install -o root -g sing-box -m640 "$candidate_sing" "$SING_CFG"
              systemctl restart sing-box >/dev/null 2>&1 || ok=0
            fi
            sleep 2
            [[ "$(systemctl show -p MainPID --value xray)" == "$xray_pid" ]] || ok=0
            verify_xray_runtime || ok=0
            verify_sing_runtime || ok=0
            if (( ok == 1 )); then
              [[ -z "$delete_dir" ]] || rm -rf -- "$delete_dir"
              return 0
            fi
            echo "新配置验证失败，正在恢复旧状态。" >&2
            install -o root -g root -m600 "$old_state" "$STATE_FILE"
            install -o root -g xray -m640 "$old_xray" "$XRAY_CFG"
            xray_hot_reset "$old_xray" "$old_xray" "$candidate_xray" || true
            if (( sing_changed == 1 )) && [[ -s "$old_sing" ]]; then
              install -o root -g sing-box -m640 "$old_sing" "$SING_CFG"
              systemctl restart sing-box >/dev/null 2>&1 || true
            fi
            fail "新配置未生效，已恢复旧配置。"
          }

          '''
          h,n=re.subn(r'(?ms)^apply_candidate_with_rollback\(\) \{.*?^\}\n\ngenerate_client_files\(\) \{',new_apply+'generate_client_files() {',h,count=1)
          if n!=1: raise SystemExit('host: apply candidate function not replaced')

          host_path.write_text(h,encoding='utf-8')

          # POSIX landing QR and Loon fix.
          landing_path=Path('core-src/landing.sh')
          l=landing_path.read_text(encoding='utf-8')
          l=l.replace("salamander-password={loon_q(h['obfs_password'])}","salamander-password={h['obfs_password']}")
          l,n=re.subn(r'qrencode -t ANSIUTF8 -m\s*1 "\$uri"','print_ssh_qr "$uri" || true',l)
          if n < 1: raise SystemExit('landing: no QR calls replaced')
          helper=r'''print_ssh_qr() {
            qr_value="$1"
            qr_tmp="$(mktemp /tmp/vvv-landing-qr.XXXXXX)"
            qrencode -t ANSIUTF8 -m 1 "$qr_value" > "$qr_tmp"
            qr_width="$(python3 - "$qr_tmp" <<'PY_QR_WIDTH'
          import re,sys,unicodedata
          ansi=re.compile(r'\x1b\[[0-9;?]*[ -/]*[@-~]')
          width=0
          for raw in open(sys.argv[1],encoding='utf-8',errors='ignore'):
              text=ansi.sub('',raw.rstrip('\n')); n=0
              for ch in text:
                  if unicodedata.combining(ch): continue
                  n += 2 if unicodedata.east_asian_width(ch) in ('W','F') else 1
              width=max(width,n)
          print(width)
          PY_QR_WIDTH
          )"
            qr_cols="$(tput cols 2>/dev/null || echo 120)"
            if [ "$qr_width" -gt "$qr_cols" ]; then
              echo "提示：终端过窄，请放大窗口后重新显示二维码。" >&2
              rm -f "$qr_tmp"; return 1
            fi
            printf '\033[47m%*s\033[0m\n' "$qr_width" ''
            cat "$qr_tmp"; printf '\n'; rm -f "$qr_tmp"
          }

          '''
          marker='''retry() {'''
          if marker not in l: raise SystemExit('landing: retry function not found')
          l=l.replace(marker,helper+marker,1)
          landing_path.write_text(l,encoding='utf-8')
          PY

          bash -n core-src/host.sh
          sh -n core-src/landing.sh
          grep -q 'listen":"127.0.0.1:10085' core-src/host.sh
          grep -q 'reserve_users' core-src/host.sh
          grep -q 'api adrules' core-src/host.sh
          ! grep -q 'salamander-password={loon_q' core-src/host.sh
          ! grep -q 'salamander-password={loon_q' core-src/landing.sh
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/host.sh core-src/landing.sh
          git commit -m 'Keep Xray alive while changing relay lines'
          git push
