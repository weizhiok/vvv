name: Apply deleted slot reclaim
on:
  push:
    branches: [agent/reclaim-deleted-relay-slots]
  workflow_dispatch:
concurrency:
  group: apply-deleted-slot-reclaim
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reclaim-deleted-relay-slots
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Apply source transformation
        run: |
          set -Eeuo pipefail
          python3 tools/apply_deleted_slot_reclaim.py
          bash -n core-src/host.sh
          chmod +x tests/test_deleted_slot_reclaim.sh
          tests/test_deleted_slot_reclaim.sh
          python3 tests/conformance.py
      - name: Commit transformed source
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/host.sh
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Reclaim retired slots when re-adding the same relay'
          git push origin HEAD:agent/reclaim-deleted-relay-slots
