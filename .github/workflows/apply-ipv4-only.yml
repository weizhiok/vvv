name: Apply IPv4-only patch

on:
  push:
    branches: [agent/force-ipv4-only]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/force-ipv4-only
      - name: Apply IPv4-only patch
        run: python3 tools/apply_ipv4_only_patch.py
      - name: Syntax check patched sources
        run: |
          bash -n vvv-install.sh
          bash -n core-src/bootstrap.sh
          bash -n core-src/host.sh
          sh -n core-src/landing.sh
          bash -n core-src/center_install.sh
          bash -n core-src/center_transport.sh
          sh -n core-src/ipv4_only.sh
          python3 -m py_compile core-src/hy2_port_hop.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh core-src/bootstrap.sh core-src/host.sh core-src/landing.sh core-src/center_install.sh core-src/center_transport.sh core-src/hy2_port_hop.py
          git diff --cached --quiet && exit 0
          git commit -m "Force VVV server roles to IPv4-only"
          git push
