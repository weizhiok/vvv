name: Apply IPv4-only patch

on:
  push:
    branches: [agent/force-ipv4-only]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/force-ipv4-only
      - name: Audit IPv4-only patch
        run: python3 tools/apply_ipv4_only_patch.py
      - name: Run focused IPv4-only regressions
        run: |
          python3 -m py_compile tests/test_ipv4_only.py tests/test_hy2_port_hopping.py core-src/hy2_port_hop.py
          python3 tests/test_ipv4_only.py
          python3 tests/test_hy2_port_hopping.py
      - name: Syntax check patched sources
        run: |
          bash -n vvv-install.sh
          bash -n core-src/bootstrap.sh
          bash -n core-src/host.sh
          sh -n core-src/landing.sh
          bash -n core-src/center_install.sh
          bash -n core-src/center_transport.sh
          sh -n core-src/ipv4_only.sh
