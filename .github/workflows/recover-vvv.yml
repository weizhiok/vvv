name: Recover VVV payload

on:
  push:
    paths:
      - .github/workflows/recover-vvv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and validate VVV
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import base64
          import gzip
          import itertools
          import os
          import re
          import subprocess
          import sys
          import tempfile

          def git(*args, check=True):
              p = subprocess.run(["git", *args], stdout=subprocess.PIPE,
                                 stderr=subprocess.DEVNULL, check=check)
              return p.stdout

          def natural_key(path):
              return [int(x) if x.isdigit() else x.lower()
                      for x in re.split(r"(\d+)", path)]

          def clean_b64(blob):
              text = blob.decode("utf-8-sig", errors="strict")
              return re.sub(r"\s+", "", text)

          def validate_script(data, label):
              if not data.startswith(b"#!/usr/bin/env bash"):
                  return None
              if b"VVV" not in data and b"vvv" not in data:
                  return None
              fd, path = tempfile.mkstemp(prefix="vvv-recover-", suffix=".sh")
              try:
                  os.write(fd, data)
                  os.close(fd)
                  r = subprocess.run(["bash", "-n", path],
                                     stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL)
                  if r.returncode != 0:
                      return None
              finally:
                  try:
                      os.unlink(path)
                  except FileNotFoundError:
                      pass
              print(f"RECOVERED={label}")
              return data

          def decode_parts(blobs, label):
              cleaned = []
              try:
                  cleaned = [clean_b64(x) for x in blobs]
              except Exception:
                  return None

              # Mode A: pieces are slices of one Base64 stream.
              try:
                  raw = base64.b64decode("".join(cleaned), validate=True)
                  data = gzip.decompress(raw)
                  ok = validate_script(data, label + ":combined")
                  if ok is not None:
                      return ok
              except Exception:
                  pass

              # Mode B: each piece is independently Base64 encoded.
              try:
                  raw = b"".join(base64.b64decode(x, validate=True)
                                 for x in cleaned)
                  data = gzip.decompress(raw)
                  ok = validate_script(data, label + ":per-part")
                  if ok is not None:
                      return ok
              except Exception:
                  pass
              return None

          commits = git("rev-list", "--all", "--date-order").decode().splitlines()
          recovered = None

          # First test every historical repository state as it actually existed.
          for commit in commits:
              paths = git("ls-tree", "-r", "--name-only", commit).decode().splitlines()
              candidates = [p for p in paths
                            if p.startswith("payload/") and "part" in p.lower()]
              candidates.sort(key=natural_key)
              if len(candidates) < 2:
                  continue
              blobs = []
              usable = True
              for path in candidates:
                  out = git("show", f"{commit}:{path}", check=False)
                  if not out:
                      usable = False
                      break
                  blobs.append(out)
              if not usable:
                  continue
              recovered = decode_parts(blobs,
                                       f"commit={commit[:12]},files={len(candidates)}")
              if recovered is not None:
                  break

          # If no complete historical state worked, combine historical versions
          # of the current 16 canonical pieces. Only changed pieces create extra
          # combinations, so this remains small for this repository.
          if recovered is None:
              current_paths = git("ls-tree", "-r", "--name-only", "HEAD").decode().splitlines()
              current_paths = [p for p in current_paths
                               if re.fullmatch(r"payload/vvv\.part\d+", p)]
              current_paths.sort(key=natural_key)
              version_sets = []
              for path in current_paths:
                  versions = []
                  seen = set()
                  history = git("log", "--format=%H", "--all", "--", path).decode().splitlines()
                  for commit in history:
                      blob = git("show", f"{commit}:{path}", check=False)
                      if not blob or blob in seen:
                          continue
                      seen.add(blob)
                      versions.append((commit, blob))
                  if not versions:
                      break
                  version_sets.append(versions)

              combinations = 1
              for versions in version_sets:
                  combinations *= len(versions)
              if version_sets and combinations <= 20000:
                  for index, combo in enumerate(itertools.product(*version_sets), 1):
                      blobs = [item[1] for item in combo]
                      recovered = decode_parts(blobs, f"mixed-combination={index}")
                      if recovered is not None:
                          break

          if recovered is None:
              print("无法从 Git 历史恢复有效 VVV 主程序。", file=sys.stderr)
              sys.exit(1)

          with open("vvv.sh", "wb") as f:
              f.write(recovered)
          os.chmod("vvv.sh", 0o755)
          PY

          bash -n vvv.sh
          sha256sum vvv.sh > sha256.txt

          cat > install.sh <<'INSTALL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          RAW="https://raw.githubusercontent.com/weizhiok/vvv/main"
          TMP="$(mktemp -d /tmp/vvv-install.XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT

          fail() {
            echo "错误：$*" >&2
            exit 1
          }

          [[ "$(id -u)" -eq 0 ]] || fail "请使用 root 用户运行。"

          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl ca-certificates
            else
              fail "系统缺少 curl，且无法自动安装。"
            fi
          fi

          command -v sha256sum >/dev/null 2>&1 || fail "系统缺少 sha256sum。"

          echo "正在下载 VVV 主程序……"
          nonce="$(date +%s)-$$"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 \
            "$RAW/vvv.sh?v=$nonce" -o "$TMP/vvv.sh" \
            || fail "下载 vvv.sh 失败。"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 \
            "$RAW/sha256.txt?v=$nonce" -o "$TMP/sha256.txt" \
            || fail "下载校验文件失败。"

          expected="$(awk '$2=="vvv.sh"{print $1; exit}' "$TMP/sha256.txt")"
          actual="$(sha256sum "$TMP/vvv.sh" | awk '{print $1}')"
          [[ -n "$expected" ]] || fail "校验文件中没有 vvv.sh。"
          [[ "$expected" == "$actual" ]] \
            || fail "VVV 主程序校验失败。期望：$expected，实际：$actual"

          bash -n "$TMP/vvv.sh" || fail "VVV 主程序语法检查失败。"
          chmod 700 "$TMP/vvv.sh"
          echo "VVV 主程序下载和校验成功。"

          if [[ -r /dev/tty ]]; then
            exec bash "$TMP/vvv.sh" </dev/tty
          else
            exec bash "$TMP/vvv.sh"
          fi
          INSTALL
          chmod 755 install.sh

      - name: Commit recovered direct-download release
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vvv.sh sha256.txt install.sh
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "恢复 VVV 主程序并改为单文件安装"
          git push origin HEAD:main
