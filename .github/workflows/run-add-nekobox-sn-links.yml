name: Add NekoBox SN links
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-add-nekobox-sn-links.yml'
      - 'tools/add_nekobox_sn_links.py'
      - 'tools/fix_sn_upgrade_sandbox.py'
      - 'core-src/client_adapters.py'
      - 'core-src/client_upgrade_engine.py'
      - 'tests/test_client_port_hopping.py'
      - 'tests/client_upgrade_isolation_validation.py'
      - 'tests/conformance.py'
      - 'tests/final_runtime_validation.sh'
permissions:
  contents: write
concurrency:
  group: add-nekobox-sn-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add NekoBox SN links
        run: |
          python3 tools/add_nekobox_sn_links.py
          python3 tools/fix_sn_upgrade_sandbox.py
      - name: Validate SN rendering and contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/client_adapters.py core-src/client_upgrade_engine.py
          bash -n tests/final_runtime_validation.sh
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/client_upgrade_isolation_validation.py
          python3 tests/conformance.py
      - name: Commit verified source and tests
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core-src/client_adapters.py \
            core-src/client_upgrade_engine.py \
            tests/test_client_port_hopping.py \
            tests/client_upgrade_isolation_validation.py \
            tests/conformance.py \
            tests/final_runtime_validation.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Use NekoBox SN links for local display'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
