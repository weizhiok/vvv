name: Final validate and cleanup
on:
  push:
    paths:
      - '.github/workflows/final-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply permanent conformance and run final validation
        shell: bash
        run: |
          set -Eeuxo pipefail
          python3 -m py_compile tools/add_debian13_conformance.py
          python3 tools/add_debian13_conformance.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip jq openssl iproute2 qrencode
          XRAY_VERSION="$(sed -n 's/^XRAY_FALLBACK_VERSION="\([^"]*\)"/\1/p' core-src/host.sh | head -n1)"
          SING_VERSION="$(sed -n 's/^SING_BOX_FALLBACK_VERSION="\([^"]*\)"/\1/p' core-src/host.sh | head -n1)"
          [[ -n "$XRAY_VERSION" && -n "$SING_VERSION" ]]
          curl -fL --retry 5 --retry-all-errors "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray-unpack
          install -m755 /tmp/xray-unpack/xray /tmp/xray
          curl -fL --retry 5 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz" -o /tmp/sing-box.tgz
          tar -xzf /tmp/sing-box.tgz -C /tmp
          install -m755 "/tmp/sing-box-${SING_VERSION}-linux-amd64/sing-box" /tmp/sing-box
          chmod +x tests/final_runtime_validation.sh
          tests/final_runtime_validation.sh /tmp/xray /tmp/sing-box | tee /tmp/vvv-final-cleanup-validation.log
          grep -q 'ALL CONFORMANCE TESTS PASSED' /tmp/vvv-final-cleanup-validation.log
          grep -q 'FINAL RUNTIME VALIDATION PASSED' /tmp/vvv-final-cleanup-validation.log
      - name: Remove obsolete artifacts
        shell: bash
        run: |
          set -Eeuxo pipefail
          git rm -rf --ignore-unmatch \
            .staging-refactor bundle install payload src-v2 tools v2 validation \
            install.sh sha256.txt version.txt src/bootstrap.sh core-src/validation.txt
          find .github/workflows -maxdepth 1 -type f ! -name validate.yml -print0 | xargs -0 -r git rm -f --
      - name: Verify clean production tree
        shell: bash
        run: |
          set -Eeuxo pipefail
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py core-src/backup_manager.py tests/conformance.py tests/extract_manager_library.py tests/build_slot_fixture.py
          bash -n vvv-install.sh
          bash -n core-src/bootstrap.sh
          bash -n core-src/host.sh
          bash -n core-src/center_install.sh
          bash -n core-src/register_sync.sh
          bash -n core-src/vvv_manager.sh
          bash -n core-src/rclone_manager.sh
          bash -n core-src/qr_helper.sh
          sh -n core-src/landing.sh
          python3 tests/conformance.py
          [[ "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" == validate.yml ]]
          [[ ! -e src/bootstrap.sh ]]
          [[ ! -e tools && ! -e validation && ! -e .staging-refactor ]]
          [[ ! -e payload && ! -e bundle && ! -e v2 && ! -e src-v2 ]]
          find . -maxdepth 2 -type f -not -path './.git/*' -printf '%p\n' | sort
      - name: Commit final clean repository
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md vvv-install.sh core-src src tests .github/workflows/validate.yml
          git status --short
          git commit -m 'Finalize validated VVV Debian 13 release'
          git push
