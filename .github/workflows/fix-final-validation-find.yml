name: Fix final validation binary lookup
on:
  push:
    paths:
      - '.github/workflows/fix-final-validation-find.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict find to extracted sing-box directory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-runtime-validation.yml')
          s=p.read_text(encoding='utf-8')
          old='''          tar -xzf /tmp/sing.tgz -C /tmp
                    find /tmp -type f -name sing-box -perm -111 | head -n1 | xargs -I{} cp {} /tmp/sing-box
                    chmod +x /tmp/sing-box'''
          new='''          rm -rf /tmp/sing-extracted; mkdir -p /tmp/sing-extracted
                    tar -xzf /tmp/sing.tgz -C /tmp/sing-extracted
                    sing_binary="$(find /tmp/sing-extracted -type f -name sing-box -perm -111 -print -quit)"
                    [[ -n "$sing_binary" ]] || { echo "sing-box archive has no executable" >&2; exit 1; }
                    cp "$sing_binary" /tmp/sing-box
                    chmod +x /tmp/sing-box'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'find /tmp/sing-extracted' .github/workflows/final-runtime-validation.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/final-runtime-validation.yml
          git commit -m 'Fix final runtime binary lookup'
          git push
