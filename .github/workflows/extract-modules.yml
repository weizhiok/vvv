name: Extract VVV modules

on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/modules.b64'
      - '.github/workflows/extract-modules.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize, decode and extract
        shell: bash
        run: |
          set -u
          rm -rf src-v2
          mkdir -p src-v2

          tr -d '\r\n\t ' < v2/modules.b64 > /tmp/modules.clean.b64
          size="$(wc -c < /tmp/modules.clean.b64 | tr -d ' ')"
          rem="$((size % 4))"
          pad=0
          case "$rem" in
            0) pad=0 ;;
            2) pad=2 ;;
            3) pad=1 ;;
            *) pad=-1 ;;
          esac

          {
            echo "size=$size"
            echo "remainder=$rem"
            echo "padding_added=$pad"
          } > src-v2/validation.txt

          if [ "$pad" -lt 0 ]; then
            echo "status=invalid-base64-length" >> src-v2/validation.txt
          else
            cp /tmp/modules.clean.b64 /tmp/modules.padded.b64
            [ "$pad" -eq 0 ] || printf '%*s' "$pad" '' | tr ' ' '=' >> /tmp/modules.padded.b64

            if base64 -d /tmp/modules.padded.b64 > /tmp/modules.tar.gz 2>/tmp/base64.err; then
              echo "base64=ok" >> src-v2/validation.txt
              if gzip -t /tmp/modules.tar.gz 2>/tmp/gzip.err; then
                echo "gzip=ok" >> src-v2/validation.txt
                tar -xzf /tmp/modules.tar.gz -C src-v2
                echo "status=ok" >> src-v2/validation.txt
              else
                echo "gzip=failed" >> src-v2/validation.txt
                echo "status=invalid-gzip" >> src-v2/validation.txt
                cat /tmp/gzip.err >> src-v2/validation.txt || true
              fi
            else
              echo "base64=failed" >> src-v2/validation.txt
              echo "status=invalid-base64" >> src-v2/validation.txt
              cat /tmp/base64.err >> src-v2/validation.txt || true
            fi
          fi

          find src-v2 -maxdepth 2 -type f -printf '%P\n' | sort >> src-v2/validation.txt

          if grep -q '^status=ok$' src-v2/validation.txt; then
            for f in src-v2/*.sh; do
              [ -e "$f" ] || continue
              bash -n "$f"
            done
            python3 -m py_compile src-v2/*.py
          fi

      - name: Commit extracted ordinary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-v2
          git diff --cached --quiet && exit 0
          git commit -m '提取 VVV 普通源文件'
          git push
