name: Probe GitHub Actions
on:
  push:
    paths:
      - '.github/workflows/probe-actions.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record probe
        run: |
          mkdir -p validation
          printf 'actions=ok\nsha=%s\n' "$GITHUB_SHA" > validation/actions-probe.txt
      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/actions-probe.txt
          git commit -m 'Record GitHub Actions probe'
          git push
