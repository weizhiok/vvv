name: Validate Debian 12 and 13

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Debian ${{ matrix.debian }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    container:
      image: debian:${{ matrix.debian }}
    steps:
      - name: Prepare checkout environment
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates bash python3
      - uses: actions/checkout@v4
      - name: Install VVV system dependency set
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl unzip tar gzip openssl jq python3 python3-venv \
            iproute2 procps nftables cron tzdata kmod util-linux systemd
      - name: Validate fresh-install compatibility
        run: |
          python3 -m py_compile core-src/debian_compat.py tests/test_debian_12_13_compat.py tests/test_interrupted_dpkg_repair.py tests/test_ipv4_only.py
          bash -n vvv-install.sh
          sh -n core-src/ipv4_only.sh
          python3 tests/test_debian_12_13_compat.py
          python3 tests/test_interrupted_dpkg_repair.py
          python3 tests/test_ipv4_only.py
      - name: Verify required Debian interfaces
        run: |
          command -v bash
          command -v python3
          command -v curl
          command -v jq
          command -v nft
          command -v cron
          command -v timedatectl
          command -v systemctl
          command -v modprobe
          test -f /usr/share/zoneinfo/Asia/Shanghai
          python3 --version
          bash --version | head -n1
