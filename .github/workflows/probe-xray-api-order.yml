name: Probe safe Xray hot-load order
on:
  push:
    paths:
      - '.github/workflows/probe-xray-api-order.yml'
permissions:
  contents: write
env:
  USER: runner
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Temporarily use outbound-first API order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/prepare.py'); s=p.read_text(encoding='utf-8')
          old='''  count="$(jq '.inbounds|length' "$dir/new/in.json")"; (( count==0 )) || "$XRAY" api adi --server=127.0.0.1:10085 "$dir/new/in.json"
            count="$(jq '.outbounds|length' "$dir/new/out.json")"; (( count==0 )) || "$XRAY" api ado --server=127.0.0.1:10085 "$dir/new/out.json"'''
          new='''  count="$(jq '.outbounds|length' "$dir/new/out.json")"; (( count==0 )) || "$XRAY" api ado --server=127.0.0.1:10085 "$dir/new/out.json"
            count="$(jq '.inbounds|length' "$dir/new/in.json")"; (( count==0 )) || "$XRAY" api adi --server=127.0.0.1:10085 "$dir/new/in.json"'''
          if s.count(old)!=1: raise SystemExit('prepare hot-load block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('tests/final_runtime_validation.sh'); s=p.read_text(encoding='utf-8')
          old='''"$WORK/xray" api adi --server=127.0.0.1:10085 "$WORK/in.json"
          "$WORK/xray" api ado --server=127.0.0.1:10085 "$WORK/out.json"'''
          new='''"$WORK/xray" api ado --server=127.0.0.1:10085 "$WORK/out.json"
          "$WORK/xray" api adi --server=127.0.0.1:10085 "$WORK/in.json"'''
          if s.count(old)!=1: raise SystemExit('test hot-load block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile src/prepare.py
          bash -n tests/final_runtime_validation.sh
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq qrencode openssl curl unzip iproute2
      - name: Run complete runtime test
        shell: bash
        run: tests/final_runtime_validation.sh | tee /tmp/result.txt
      - name: Record successful order
        shell: bash
        run: |
          mkdir -p validation
          {
            echo 'status=ok'
            echo 'xray_hot_load_order=outbound,inbound,routing'
            tail -n 12 /tmp/result.txt
          } > validation/xray-hot-order.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/xray-hot-order.txt
          git commit -m 'Validate outbound-first Xray hot loading'
          git push
