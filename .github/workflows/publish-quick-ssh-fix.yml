name: Publish combined landing-direct role
on:
  push:
    branches: [agent/landing-direct-combined-role]
    paths:
      - '.github/workflows/publish-quick-ssh-fix.yml'
permissions:
  contents: write
concurrency:
  group: publish-landing-direct-role
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/publish_landing_direct_role.sh
