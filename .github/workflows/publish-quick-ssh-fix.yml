name: Publish isolated client support upgrade
on:
  push:
    paths:
      - '.github/workflows/publish-quick-ssh-fix.yml'
concurrency:
  group: publish-client-support-isolation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/publish_client_support_isolation.sh
