name: Publish SSH fixes
on:
  push:
    paths:
      - '.github/workflows/publish-quick-ssh-fix.yml'
concurrency:
  group: publish-ssh-fixes-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo 'isolated-source-publisher=1'
      - run: bash tools/run_quick_ssh_fix.sh
