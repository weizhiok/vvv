name: Validate isolated client support
on:
  pull_request:
    paths:
      - '.github/workflows/publish-quick-ssh-fix.yml'
      - 'vvv-install.sh'
      - 'core-src/client_*.py'
      - 'core-src/adapter_manager.py'
      - 'core-src/vvv_manager.sh'
      - 'core-src/center_manager.sh'
      - 'tests/client_upgrade_isolation_validation.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-quick-ssh-fix.yml'
      - 'vvv-install.sh'
      - 'core-src/client_*.py'
      - 'core-src/adapter_manager.py'
      - 'core-src/vvv_manager.sh'
      - 'core-src/center_manager.sh'
      - 'tests/client_upgrade_isolation_validation.py'
permissions:
  contents: read
jobs:
  validate-client-support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and isolation contract
        run: |
          python3 -m py_compile \
            core-src/client_adapters.py \
            core-src/client_upgrade_engine.py \
            core-src/client_local_renderer.py \
            core-src/adapter_manager.py \
            tests/client_upgrade_isolation_validation.py
          bash -n vvv-install.sh
          bash -n core-src/vvv_manager.sh
          bash -n core-src/center_manager.sh
          python3 core-src/client_adapters.py >/dev/null
          python3 tests/client_upgrade_isolation_validation.py
