name: Validate VVV
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-validated-vvv-production
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - run: bash tools/finalize_validated_production_fix.sh
