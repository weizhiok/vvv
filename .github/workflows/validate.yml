name: Publish validated Caddy fix branch
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_caddy_restart_progress_fix.py'
      - 'trigger-caddy-restart-progress-fix.txt'
      - 'core-src/bootstrap.sh'
      - 'core-src/center_install.sh'
      - 'tests/conformance.py'
      - 'tests/https_frontend_validation.sh'
      - 'README.md'
concurrency:
  group: publish-caddy-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-caddy-restart-progress-20260802
          fetch-depth: 0
      - name: Apply production patch
        run: |
          set -Eeuo pipefail
          if [[ ! -f tools/apply_caddy_restart_progress_fix.py ]]; then
            echo "Patch already applied; nothing to publish."
            exit 0
          fi
          set +e
          output="$(python3 tools/apply_caddy_restart_progress_fix.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if (( rc != 0 )) && [[ "$output" != *"missing anchor: README progress and restart policy"* ]]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''- IP 模式使用隔离的 Certbot 5.4+ 环境申请 Let’s Encrypt `shortlived` IP 地址证书；
          - IP 证书有效期较短，脚本安装 systemd 定时器每天检查两次并自动续期；'''
          new = '''- IP 模式使用隔离的 Certbot 5.4+ 环境申请 Let’s Encrypt `shortlived` IP 地址证书；
          - IP 证书有效期较短，脚本安装 systemd 定时器每天检查两次并自动续期；
          - 证书首次部署不会错误调用 Caddy reload；续期后只重启 Caddy，不重启整台 VPS，也不会中断 SSH；
          - 代理部分完成后会立即显示订阅中心的分阶段进度，依赖下载和证书申请均有明确提示与超时保护；'''
          if old not in text:
              raise SystemExit('README fallback anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify source and rendered installers
        run: |
          set -Eeuo pipefail
          if [[ ! -f tools/apply_caddy_restart_progress_fix.py ]]; then
            echo "Patch already applied; validation will run after restoring the permanent workflow."
            exit 0
          fi
          python3 -m py_compile src/prepare.py tests/conformance.py
          bash -n core-src/bootstrap.sh
          bash -n core-src/center_install.sh
          bash -n tests/https_frontend_validation.sh
          python3 tests/conformance.py
          work="$(mktemp -d)"
          cp core-src/host.sh "$work/host.sh"
          cp core-src/landing.sh "$work/landing.sh"
          cp core-src/center_install.sh "$work/center.sh"
          python3 src/prepare.py "$work/host.sh" "$work/landing.sh" "$work/center.sh"
          bash -n "$work/host.sh"
          sh -n "$work/landing.sh"
          bash -n "$work/center.sh"
      - name: Commit only production changes
        run: |
          set -Eeuo pipefail
          if [[ ! -f tools/apply_caddy_restart_progress_fix.py ]]; then
            exit 0
          fi
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_caddy_restart_progress_fix.py
          rm -f .github/workflows/apply-caddy-restart-progress-fix.yml
          rm -f trigger-caddy-restart-progress-fix.txt
          git add -A
          git commit -m "Fix Caddy certificate deployment and expose install progress"
          git push origin HEAD:fix-caddy-restart-progress-20260802
