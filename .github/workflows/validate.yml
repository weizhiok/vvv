name: Validate VVV
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - 'validation/**'
      - 'trigger-*.txt'
      - '.github/workflows/apply-ssh-log-fixes*.yml'
      - '.github/workflows/run-final-ssh-fix.yml'
      - '.github/workflows/publish-quick-ssh-fix.yml'
      - '.github/workflows/publish-production-ssh-fix.yml'
      - '.github/workflows/ssh-fix-actions-probe.yml'
      - '.github/workflows/finalize-production.yml'
      - '.github/workflows/publish-ready-branch.yml'
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-vvv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate relay ticket stdout contract
        run: python3 tests/test_relay_ticket_stdout.py
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl unzip jq openssl iproute2 nftables python3-venv
      - name: Validate deleted relay slot reclaim
        run: |
          chmod +x tests/test_deleted_slot_reclaim.sh
          tests/test_deleted_slot_reclaim.sh
      - name: Validate complete node lifecycle transactions
        run: |
          chmod +x tests/test_node_lifecycle.sh
          tests/test_node_lifecycle.sh
      - name: Validate lifecycle source uniqueness
        run: python3 tests/test_lifecycle_source_uniqueness.py
      - name: Validate Hysteria 2 port hopping and client formats
        run: |
          python3 tests/test_hy2_port_hopping.py
          python3 tests/test_client_port_hopping.py
          python3 tests/test_subscription_node_order.py
          chmod +x tests/test_quick_upstream_commands.sh
          tests/test_quick_upstream_commands.sh
      - name: Download declared proxy cores
        run: |
          set -Eeuo pipefail
          XRAY_VERSION="$(sed -n 's/^XRAY_FALLBACK_VERSION="\([^"]*\)"/\1/p' core-src/host.sh | head -n1)"
          SING_VERSION="$(sed -n 's/^SING_BOX_FALLBACK_VERSION="\([^"]*\)"/\1/p' core-src/host.sh | head -n1)"
          [[ -n "$XRAY_VERSION" && -n "$SING_VERSION" ]]
          curl -fL --retry 5 --retry-all-errors "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray-unpack
          install -m755 /tmp/xray-unpack/xray /tmp/xray
          curl -fL --retry 5 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz" -o /tmp/sing-box.tgz
          tar -xzf /tmp/sing-box.tgz -C /tmp
          install -m755 "/tmp/sing-box-${SING_VERSION}-linux-amd64/sing-box" /tmp/sing-box
          /tmp/xray version
          /tmp/sing-box version
      - name: Download Caddy and install Certbot 5.4+
        run: |
          set -Eeuo pipefail
          CADDY_API="$(curl -fsSL --retry 5 --retry-all-errors https://api.github.com/repos/caddyserver/caddy/releases/latest)"
          CADDY_URL="$(jq -r '.assets[] | select(.name|endswith("linux_amd64.tar.gz")) | .browser_download_url' <<<"$CADDY_API" | head -n1)"
          [[ -n "$CADDY_URL" && "$CADDY_URL" != null ]]
          mkdir -p /tmp/caddy-unpack
          curl -fL --retry 5 --retry-all-errors "$CADDY_URL" -o /tmp/caddy.tgz
          tar -xzf /tmp/caddy.tgz -C /tmp/caddy-unpack caddy
          install -m755 /tmp/caddy-unpack/caddy /tmp/caddy
          python3 -m venv /tmp/certbot-check
          /tmp/certbot-check/bin/pip install --disable-pip-version-check --no-cache-dir 'certbot>=5.4,<6'
      - name: Run final conformance and live-process validation
        run: |
          chmod +x tests/final_runtime_validation.sh
          tests/final_runtime_validation.sh /tmp/xray /tmp/sing-box
      - name: Validate HTTPS frontends with real tools
        run: |
          chmod +x tests/https_frontend_validation.sh
          tests/https_frontend_validation.sh /tmp/caddy /tmp/certbot-check/bin/certbot
