name: Publish validated Caddy fix branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
concurrency:
  group: publish-caddy-fix-branch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-caddy-restart-progress-20260802
          fetch-depth: 0
      - name: Apply production patch
        run: python3 tools/apply_caddy_restart_progress_fix.py
      - name: Verify source and rendered installers
        run: |
          set -Eeuo pipefail
          python3 -m py_compile src/prepare.py tests/conformance.py
          bash -n core-src/bootstrap.sh
          bash -n core-src/center_install.sh
          bash -n tests/https_frontend_validation.sh
          python3 tests/conformance.py
          work="$(mktemp -d)"
          cp core-src/host.sh "$work/host.sh"
          cp core-src/landing.sh "$work/landing.sh"
          cp core-src/center_install.sh "$work/center.sh"
          python3 src/prepare.py "$work/host.sh" "$work/landing.sh" "$work/center.sh"
          bash -n "$work/host.sh"
          sh -n "$work/landing.sh"
          bash -n "$work/center.sh"
      - name: Commit only production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_caddy_restart_progress_fix.py
          rm -f .github/workflows/apply-caddy-restart-progress-fix.yml
          rm -f trigger-caddy-restart-progress-fix.txt
          git add -A
          git commit -m "Fix Caddy certificate deployment and expose install progress"
          git push origin HEAD:fix-caddy-restart-progress-20260802
