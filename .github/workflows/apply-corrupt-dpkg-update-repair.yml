name: Apply corrupt dpkg update repair

on:
  push:
    branches: [agent/quarantine-corrupt-dpkg-updates]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-corrupt-dpkg-updates
      - name: Patch dpkg recovery paths
        run: python3 tools/apply_corrupt_dpkg_update_repair.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh core-src/host.sh core-src/landing.sh core-src/center_install.sh
          git diff --cached --quiet && exit 0
          git commit -m "Quarantine corrupt dpkg update fragments safely"
          git push
