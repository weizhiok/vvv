name: Registered host menu usability
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/registered-host-menu-usability.yml'
      - 'tools/patch_registered_host_menu.py'
permissions:
  contents: write
concurrency:
  group: registered-host-menu-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply confirmed menu changes
        run: python3 tools/patch_registered_host_menu.py
      - name: Validate exact scope
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core-src/sub_center.py tests/test_registered_host_menu.py
          bash -n core-src/center_manager.sh
          bash -n tests/final_runtime_validation.sh
          python3 tests/test_registered_host_menu.py
          python3 tests/conformance.py
          grep -Fq 'list-hosts --summary-tsv' core-src/center_manager.sh
          grep -Fq 'host_index=$((count+3))' core-src/center_manager.sh
          grep -Fq '${host_index}. 已注册主机管理' core-src/center_manager.sh
          grep -Fq '未知IP' core-src/sub_center.py
          ! grep -Fq 'delete-node' core-src/sub_center.py
          ! grep -Fq '删除节点' core-src/center_manager.sh
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core-src/center_manager.sh \
            core-src/sub_center.py \
            tests/test_registered_host_menu.py \
            tests/final_runtime_validation.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Improve registered host menu usability'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
