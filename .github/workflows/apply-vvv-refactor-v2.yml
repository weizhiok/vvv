name: Apply verified VVV architecture sources
on:
  push:
    paths:
      - '.github/workflows/apply-vvv-refactor-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install refactored ordinary sources
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          base64 -d .staging-refactor/sources.tgz.b64 > "$tmp/sources.tgz"
          gzip -t "$tmp/sources.tgz"
          tar -xzf "$tmp/sources.tgz" -C "$tmp"
          install -m755 "$tmp/bootstrap.sh" src/bootstrap.sh
          install -m755 "$tmp/prepare.py" src/prepare.py
          for f in qr_helper.sh rclone_manager.sh center_install.sh register_sync.sh vvv_manager.sh; do
            install -m755 "$tmp/$f" "core-src/$f"
          done
          for f in sub_center.py sync_agent.py; do
            install -m755 "$tmp/$f" "core-src/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vvv-install.sh')
          s=p.read_text(encoding='utf-8')
          old='files=(host.sh landing.sh center_install.sh register_sync.sh vvv_manager.sh sub_center.py sync_agent.py)'
          new='files=(host.sh landing.sh center_install.sh register_sync.sh vvv_manager.sh qr_helper.sh rclone_manager.sh sub_center.py sync_agent.py)'
          if old not in s:
              raise SystemExit('vvv-install files array not found')
          s=s.replace(old,new,1)
          old='for file in bootstrap.sh center_install.sh register_sync.sh vvv_manager.sh host.sh; do'
          new='for file in bootstrap.sh center_install.sh register_sync.sh vvv_manager.sh qr_helper.sh rclone_manager.sh host.sh; do'
          if old not in s:
              raise SystemExit('vvv-install shell validation loop not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate architecture and renderers
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n vvv-install.sh src/bootstrap.sh core-src/center_install.sh core-src/register_sync.sh core-src/vvv_manager.sh core-src/qr_helper.sh core-src/rclone_manager.sh core-src/host.sh
          sh -n core-src/landing.sh
          python3 -m py_compile src/prepare.py core-src/sub_center.py core-src/sync_agent.py
          tmp=$(mktemp -d)
          cp core-src/host.sh "$tmp/host.sh"
          cp core-src/landing.sh "$tmp/landing.sh"
          cp core-src/center_install.sh "$tmp/center_install.sh"
          python3 src/prepare.py "$tmp/host.sh" "$tmp/landing.sh" "$tmp/center_install.sh"
          bash -n "$tmp/host.sh" "$tmp/center_install.sh"
          sh -n "$tmp/landing.sh"
          python3 - <<'PY'
          import base64, importlib.util
          spec=importlib.util.spec_from_file_location('sub','core-src/sub_center.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          nodes=[
            {'name':'JP-VLESS-test','protocol':'vless','server':'1.2.3.4','port':443,'uuid':'11111111-1111-1111-1111-111111111111','sni':'www.softbank.jp','public_key':'pub','short_id':'abcd','udp':True},
            {'name':'JP-HY2-test','protocol':'hysteria2','server':'1.2.3.4','port':443,'password':'auth','sni':'hy2.local','obfs_password':'abc_DEF-123','pin':'0123','udp':True,'up_mbps':50,'down_mbps':50},
          ]
          loon=m.render_loon(nodes)
          assert 'salamander-password=abc_DEF-123' in loon
          assert 'salamander-password="' not in loon
          v2=base64.b64decode(m.render_v2rayng(nodes)).decode()
          assert 'hy2://' in v2 and 'pinSHA256' not in v2
          sr=base64.b64decode(m.render_shadowrocket(nodes)).decode()
          assert 'hysteria2://' in sr and 'pinSHA256' in sr
          assert m.FORMATS == {'c':'clash','qx':'quantumultx','ln':'loon','sr':'shadowrocket','v2':'v2rayng'}
          assert m.nodes_from_host({'role':'landing','state':{'protocol_mode':'dual'}}) == []
          PY
          if grep -R -E 'pull-backup|vvv-backup-pull|/api/v1/backup' core-src src vvv-install.sh; then exit 1; fi
          if grep -R -E 'backup.*timer|OnCalendar=.*backup|每天凌晨.*备份' core-src src; then exit 1; fi
          grep -q '安装订阅中心 + 中转主机（含自身代理）' src/bootstrap.sh
          grep -q '开启云备份功能' core-src/center_install.sh
          grep -q '查看本地备份' core-src/center_install.sh
          grep -q 'vvv_print_qr' core-src/qr_helper.sh
          mkdir -p validation
          cat > validation/refactor.txt <<'EOF'
          status=ok
          ordinary_sources=true
          new_menu=true
          short_subscription_paths=true
          loon_salamander_unquoted=true
          v2rayng_separate_renderer=true
          event_backup_only=true
          host_backup_pull_removed=true
          rclone_on_demand=true
          landing_status_only=true
          qr_top_quiet_zone=true
          EOF
      - name: Commit verified sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh src core-src validation/refactor.txt
          git commit -m 'Refactor VVV as single-host event-driven system'
          git push
