name: Apply direct address registration
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_direct_auto_registration.py'
      - 'trigger-direct-address-registration.txt'
      - '.github/workflows/apply-direct-address-registration.yml'
permissions:
  contents: write
concurrency:
  group: apply-direct-address-registration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-address-registration
          fetch-depth: 0
      - name: Apply production patch
        run: python3 tools/apply_direct_auto_registration.py
      - name: Validate registration changes
        run: |
          set -Eeuo pipefail
          bash -n core-src/bootstrap.sh
          bash -n core-src/register_sync.sh
          bash -n core-src/vvv_manager.sh
          python3 -m py_compile core-src/sync_agent.py core-src/sub_center.py tests/conformance.py
          python3 tests/conformance.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('core-src/sync_agent.py')
          spec=importlib.util.spec_from_file_location('sync_agent_test',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.normalize_center_address('82.22.26.244') == 'https://82.22.26.244:8443'
          assert module.normalize_center_address('sub.example.com') == 'https://sub.example.com:8443'
          assert module.normalize_center_address('sub.example.com:9443') == 'https://sub.example.com:9443'
          print('PASS center address normalization')
          PY
          ! grep -F 'local supplied_code="${1:-}" role code="$supplied_code"' core-src/bootstrap.sh
          grep -F 'return 0' core-src/bootstrap.sh >/dev/null
          work="$(mktemp -d)"
          cp core-src/host.sh "$work/host.sh"
          cp core-src/landing.sh "$work/landing.sh"
          cp core-src/center_install.sh "$work/center.sh"
          python3 src/prepare.py "$work/host.sh" "$work/landing.sh" "$work/center.sh"
          bash -n "$work/host.sh"
          sh -n "$work/landing.sh"
          bash -n "$work/center.sh"
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_direct_auto_registration.py trigger-direct-address-registration.txt .github/workflows/apply-direct-address-registration.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Fix final registration and add direct address enrollment"
          git push origin HEAD:agent/direct-address-registration
