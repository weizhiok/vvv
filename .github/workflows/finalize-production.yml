name: Finalize production SSH fix
on:
  push:
    paths:
      - 'trigger-finalize-production.txt'
concurrency:
  group: finalize-production-ssh-fix
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - run: bash tools/finalize_validated_production_fix.sh
