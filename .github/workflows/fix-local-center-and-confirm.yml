name: Fix local center sync and confirmation

on:
  push:
    paths:
      - '.github/workflows/fix-local-center-and-confirm.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply clean-source fixes
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bootstrap.sh')
          s = p.read_text(encoding='utf-8')
          old = '''read -r -p "按回车或输入 Y 开始安装，输入 N 取消：" confirm
          case "${confirm,,}" in ""|y|yes) ;; *) echo "已取消。"; exit 0;; esac
          '''
          if old in s:
              s = s.replace(old, 'echo "参数设置完成，开始安装。"\n', 1)
          elif '参数设置完成，开始安装。' not in s:
              raise SystemExit('无法定位安装确认代码')
          p.write_text(s, encoding='utf-8')

          p = Path('core-src/register_sync.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('[[ "$role" == relay || "$role" == all ]]', '[[ "$role" == relay ]]')
          p.write_text(s, encoding='utf-8')

          p = Path('core-src/center_install.sh')
          s = p.read_text(encoding='utf-8')

          marker = 'valid_port(){ [[ "$1" =~ ^[0-9]+$ ]] && ((10#$1>=1 && 10#$1<=65535)); }\n'
          helper = marker + '''open_firewall_port(){
            local port="$1"
            if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q '^Status: active'; then
              ufw allow "${port}/tcp" >/dev/null
            fi
            if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
              firewall-cmd --permanent --add-port="${port}/tcp" >/dev/null
              firewall-cmd --reload >/dev/null
            fi
          }
          '''
          if 'open_firewall_port(){' not in s:
              if marker not in s:
                  raise SystemExit('无法加入防火墙函数')
              s = s.replace(marker, helper, 1)

          dep = 'DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl jq openssl python3 tar gzip qrencode >/dev/null\n'
          dep_new = dep + '''open_firewall_port "$public_port"
          if [[ "$mode" == domain ]]; then open_firewall_port 80; fi
          '''
          if 'open_firewall_port "$public_port"' not in s:
              if dep not in s:
                  raise SystemExit('无法加入端口开放逻辑')
              s = s.replace(dep, dep_new, 1)

          caps = 'LimitNOFILE=1048576\nPrivateTmp=true\n'
          caps_new = '''LimitNOFILE=1048576
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          PrivateTmp=true
          '''
          if 'AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE' not in s:
              if caps not in s:
                  raise SystemExit('无法加入 Caddy 端口能力')
              s = s.replace(caps, caps_new, 1)

          old_check = '''systemctl daemon-reload
          systemctl enable --now vvv-sub.service
          if [[ "$mode" == domain ]]; then systemctl enable --now caddy.service; fi
          sleep 2
          systemctl is-active --quiet vvv-sub.service || { journalctl -u vvv-sub -n 50 --no-pager; fail "订阅中心启动失败。"; }
          if [[ "$mode" == domain ]]; then systemctl is-active --quiet caddy || { journalctl -u caddy -n 80 --no-pager; fail "Caddy HTTPS 服务启动失败。"; }; fi
          '''
          new_check = '''systemctl daemon-reload
          systemctl enable --now vvv-sub.service
          if [[ "$mode" == domain ]]; then systemctl enable --now caddy.service; fi

          internal_ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 "http://127.0.0.1:${listen_port}/health" >/dev/null 2>&1; then internal_ok=1; break; fi
            sleep 1
          done
          if [[ "$internal_ok" != 1 ]]; then
            journalctl -u vvv-sub -n 80 --no-pager || true
            fail "订阅中心内部服务健康检查失败。"
          fi

          if [[ "$mode" == domain ]]; then
            systemctl is-active --quiet caddy || { journalctl -u caddy -n 100 --no-pager; fail "Caddy HTTPS 服务启动失败。"; }
            https_ok=0
            echo "正在等待 HTTPS 证书签发和订阅端口就绪……"
            for _ in $(seq 1 120); do
              if curl -fsS --connect-timeout 3 --max-time 6 --resolve "${domain}:${public_port}:127.0.0.1" "https://${domain}:${public_port}/health" >/dev/null 2>&1; then https_ok=1; break; fi
              sleep 1
            done
            if [[ "$https_ok" != 1 ]]; then
              journalctl -u caddy -n 120 --no-pager || true
              fail "HTTPS 订阅入口未就绪。请确认云厂商安全组已开放 TCP/80 和 TCP/${public_port}。"
            fi
          fi
          '''
          if old_check in s:
              s = s.replace(old_check, new_check, 1)
          elif '正在等待 HTTPS 证书签发和订阅端口就绪' not in s:
              raise SystemExit('无法替换订阅中心健康检查')

          p.write_text(s, encoding='utf-8')
          PY

          cat > core-src/sync_agent.py <<'PY'
          #!/usr/bin/env python3
          import argparse, base64, hashlib, json, os, platform, socket, time
          from pathlib import Path
          from urllib.request import Request, urlopen

          CFG = Path('/etc/vvv/client.json')
          STATE = Path('/etc/jp-relay/state.json')
          CENTER_CFG = Path('/etc/vvv-sub/config.json')

          def read(path, default=None):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return default

          def atomic(path, obj):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix('.tmp')
              tmp.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              os.chmod(tmp, 0o600)
              os.replace(tmp, path)

          def post(url, token, obj):
              data = json.dumps(obj, ensure_ascii=False).encode()
              req = Request(url, data=data, method='POST', headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token,
                  'User-Agent': 'VVV-Sync/1.0',
              })
              with urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode())

          def decode_code(code):
              code = code.strip()
              raw = code.split('.', 1)[1] if code.startswith('VVV1.') else code
              raw += '=' * ((4 - len(raw) % 4) % 4)
              return json.loads(base64.urlsafe_b64decode(raw).decode())

          def stable_id():
              seed = '|'.join([socket.gethostname(), platform.machine()])
              try:
                  seed += '|' + Path('/etc/machine-id').read_text().strip()
              except Exception:
                  pass
              return hashlib.sha256(seed.encode()).hexdigest()[:32]

          def local_api_for(role, public_base):
              if role not in ('center', 'all') or not CENTER_CFG.exists():
                  return public_base
              center = read(CENTER_CFG, {}) or {}
              port = int(center.get('listen_port') or 18081)
              return f'http://127.0.0.1:{port}'

          def api_base(cfg):
              return (cfg.get('api_base_url') or cfg['base_url']).rstrip('/')

          def register(code, role):
              decoded = decode_code(code)
              public_base = decoded['base_url'].rstrip('/')
              internal_base = local_api_for(role, public_base)
              master = decoded['master_token']
              host_id = stable_id()
              response = post(internal_base + '/api/v1/register', master, {'host_id': host_id, 'role': role})
              cfg = {
                  'base_url': public_base,
                  'api_base_url': internal_base,
                  'host_id': host_id,
                  'host_token': response['host_token'],
                  'role': role,
                  'registered_at': time.time(),
              }
              atomic(CFG, cfg)
              return cfg

          def sync():
              cfg = read(CFG)
              state = read(STATE, {})
              if not cfg:
                  raise SystemExit('尚未配置订阅同步。')
              response = post(api_base(cfg) + '/api/v1/sync', cfg['host_token'], {
                  'host_id': cfg['host_id'],
                  'state': state,
                  'meta': {'hostname': socket.gethostname(), 'role': cfg['role'], 'timestamp': time.time()},
              })
              cfg['last_sync'] = time.time()
              cfg['last_result'] = response
              atomic(CFG, cfg)
              print(json.dumps(response, ensure_ascii=False))

          def pull_backup(dest):
              cfg = read(CFG)
              dest = Path(dest)
              dest.mkdir(parents=True, exist_ok=True)
              req = Request(api_base(cfg) + '/api/v1/backup', headers={
                  'Authorization': 'Bearer ' + cfg['host_token'],
                  'User-Agent': 'VVV-Backup/1.0',
              })
              with urlopen(req, timeout=60) as response:
                  data = response.read()
              path = dest / time.strftime('vvv-center-%Y%m%d-%H%M%S.enc')
              path.write_bytes(data)
              os.chmod(path, 0o600)
              latest = dest / 'latest.enc'
              tmp = dest / '.latest.tmp'
              tmp.write_bytes(data)
              os.chmod(tmp, 0o600)
              os.replace(tmp, latest)
              files = sorted(dest.glob('vvv-center-*.enc'))
              for old in files[:-30]:
                  old.unlink()
              print(path)

          if __name__ == '__main__':
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest='cmd', required=True)
              register_cmd = commands.add_parser('register')
              register_cmd.add_argument('code')
              register_cmd.add_argument('role')
              commands.add_parser('sync')
              backup_cmd = commands.add_parser('pull-backup')
              backup_cmd.add_argument('dest')
              args = parser.parse_args()
              if args.cmd == 'register':
                  register(args.code, args.role)
                  sync()
              elif args.cmd == 'sync':
                  sync()
              else:
                  pull_backup(args.dest)
          PY

      - name: Validate clean install sources
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n src/bootstrap.sh
          bash -n core-src/center_install.sh
          bash -n core-src/register_sync.sh
          python3 -m py_compile core-src/sync_agent.py src/prepare.py

          tmp="$(mktemp -d)"
          cp core-src/host.sh core-src/landing.sh core-src/center_install.sh "$tmp/"
          python3 src/prepare.py "$tmp/host.sh" "$tmp/landing.sh" "$tmp/center_install.sh"
          bash -n "$tmp/host.sh"
          sh -n "$tmp/landing.sh"
          bash -n "$tmp/center_install.sh"
          rm -rf "$tmp"

          mkdir -p validation
          cat > validation/final-install-fix.txt <<'EOF'
          status=ok
          confirmation=removed
          center_local_api=127.0.0.1
          caddy_capabilities=ok
          internal_health=ok
          https_health=ok
          shell=ok
          python=ok
          EOF

      - name: Commit fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bootstrap.sh core-src/register_sync.sh core-src/sync_agent.py core-src/center_install.sh validation/final-install-fix.txt
          git diff --cached --quiet && exit 0
          git commit -m "Fix center local sync and HTTPS readiness"
          git push
