name: Normalize dpkg printf

on:
  push:
    branches: [agent/quarantine-corrupt-dpkg-updates]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-corrupt-dpkg-updates
      - run: python3 tools/normalize_dpkg_printf.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vvv-install.sh core-src/host.sh core-src/landing.sh core-src/center_install.sh
          git diff --cached --quiet && exit 0
          git commit -m "Normalize dpkg audit printf"
          git push
