name: Dump generated Xray API configuration
on:
  push:
    paths:
      - '.github/workflows/dump-xray-api-config.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transform and extract Xray builder
        shell: bash
        run: |
          set -Eeuo pipefail
          cp core-src/host.sh /tmp/host.sh
          cp core-src/landing.sh /tmp/landing.sh
          cp core-src/center_install.sh /tmp/center.sh
          python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          awk "/<<'PY_BUILD_XRAY'/{f=1;next}/^PY_BUILD_XRAY$/{f=0}f" /tmp/host.sh >/tmp/build_xray.py
          mkdir -p /tmp/tls validation
          python3 - <<'PY'
          import json
          state={
           'schema':3,'role':'japan-hub','protocol_mode':'vless','public_ip':'127.0.0.1','listen_port':18443,'sni':'www.softbank.jp','direct_base_name':'test','xray_version':'test','sing_box_version':'test','relay_manager_enabled':True,
           'vless':{'reality':{'private_key':'PRIVATE','public_key':'PUBLIC','short_id':'0123456789abcdef'},'direct_user':{'uuid':'11111111-1111-4111-8111-111111111111','email':'direct@test'},'reserve_users':[{'slot':'v01','uuid':'22222222-2222-4222-8222-222222222222','email':'reserve@test','assigned_id':None}]},
           'hy2':None,'relays':[],'upstream_relays':[]}
          json.dump(state,open('/tmp/state.json','w'))
          PY
          python3 /tmp/build_xray.py /tmp/state.json /tmp/xray.json
          jq '{api:.api,api_inbound:[.inbounds[]|select(.tag=="api-in")],api_rules:[.routing.rules[]|select((.ruleTag//"")|test("api"))],outbound_tags:[.outbounds[].tag],all_rule_tags:[.routing.rules[].ruleTag]}' /tmp/xray.json > validation/xray-api-generated.json
      - name: Commit dump
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/xray-api-generated.json
          git commit -m 'Dump generated Xray API configuration'
          git push
