name: Fix client format runtime tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-client-format-tests.yml'
      - 'tests/final_runtime_validation.sh'
      - 'tests/client_upgrade_isolation_validation.py'
permissions:
  contents: write
concurrency:
  group: fix-client-format-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update runtime expectations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/final_runtime_validation.sh')
          text = path.read_text(encoding='utf-8')
          old = '''[[ -s "$WORK/client-files/NekoBoxForAndroid.txt" ]]
          [[ ! -e "$WORK/client-files/NekoBoxForAndroid.yaml" ]]
          [[ ! -e "$WORK/client-files/Loon-Shadowrocket.txt" ]]
          ! find "$WORK/client-files" -maxdepth 1 -type f -iname '*v2*' | grep -q .
          grep -q '^vless=' "$WORK/client-files/Quantumult-X.conf"
          grep -q 'Hysteria2' "$WORK/client-files/Loon.conf"
          grep -q 'server-ports="24443,30000-30031"' "$WORK/client-files/Loon.conf"
          grep -q '^hysteria2://' "$WORK/client-files/Shadowrocket.txt"
          grep -q '24443,30000-30031' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'type: hysteria2' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'ports: "24443,30000-30031"' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'hop-interval: 30' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q '^hy2://' "$WORK/client-files/NekoBoxForAndroid.txt"
          grep -q '24443,30000-30031' "$WORK/client-files/NekoBoxForAndroid.txt"
          '''
          new = '''[[ -e "$WORK/client-files/NekoBoxForAndroid.txt" ]]
          [[ ! -s "$WORK/client-files/NekoBoxForAndroid.txt" ]]
          [[ -s "$WORK/client-files/NekoBoxForAndroid-基础URI.txt" ]]
          [[ -e "$WORK/client-files/Loon-Import.txt" && ! -s "$WORK/client-files/Loon-Import.txt" ]]
          [[ ! -e "$WORK/client-files/NekoBoxForAndroid.yaml" ]]
          [[ ! -e "$WORK/client-files/Loon-Shadowrocket.txt" ]]
          ! find "$WORK/client-files" -maxdepth 1 -type f -iname '*v2*' | grep -q .
          grep -q '^vless=' "$WORK/client-files/Quantumult-X.conf"
          grep -q 'Hysteria2' "$WORK/client-files/Loon.conf"
          grep -q 'server-ports="24443,30000-30031"' "$WORK/client-files/Loon.conf"
          grep -q 'hop-interval=30' "$WORK/client-files/Loon.conf"
          grep -q 'download-bandwidth=50' "$WORK/client-files/Loon.conf"
          grep -q '^hysteria2://' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'fastopen=1' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'upmbps=30' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'downmbps=50' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'mport=24443,30000-30031' "$WORK/client-files/Shadowrocket.txt"
          grep -q 'type: hysteria2' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'ports: "24443,30000-30031"' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'hop-interval: "20-30"' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'up: "30 Mbps"' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q 'down: "50 Mbps"' "$WORK/client-files/Clash-Verge-Rev.yaml"
          ! grep -q '^proxy-groups:' "$WORK/client-files/Clash-Verge-Rev.yaml"
          ! grep -q '^rules:' "$WORK/client-files/Clash-Verge-Rev.yaml"
          grep -q '^hy2://' "$WORK/client-files/NekoBoxForAndroid-基础URI.txt"
          grep -q 'mport=24443,30000-30031' "$WORK/client-files/NekoBoxForAndroid-基础URI.txt"
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('final runtime client block not found')

          path = Path('tests/client_upgrade_isolation_validation.py')
          text = path.read_text(encoding='utf-8')
          old = '''def verify_new_outputs(directory, role):
              neko = directory / 'NekoBoxForAndroid.txt'
              require(neko.is_file(), f'{role}缺少 NekoBox 独立分享链接输出')
              require('hy2://' in neko.read_text(encoding='utf-8'), f'{role} NekoBox 输出缺少 hy2:// 链接')
              require(not (directory / 'NekoBoxForAndroid.yaml').exists(), f'{role}未清理旧 NekoBox YAML')
              require(not (directory / 'Loon-Shadowrocket.txt').exists(), f'{role}未清理旧混合分享文件')
              loon = (directory / 'Loon.conf').read_text(encoding='utf-8')
              require('server-ports="443,20000-50000"' in loon, f'{role} Loon 输出缺少端口跳跃')
              clash = (directory / 'Clash-Verge-Rev.yaml').read_text(encoding='utf-8')
              require('ports: "443,20000-50000"' in clash and 'hop-interval: 30' in clash,
                      f'{role} Mihomo 输出缺少端口跳跃')
          '''
          new = '''def verify_new_outputs(directory, role, expect_subscription=False):
              neko = directory / 'NekoBoxForAndroid.txt'
              basic = directory / 'NekoBoxForAndroid-基础URI.txt'
              require(neko.is_file(), f'{role}缺少 NekoBox 单节点订阅输出')
              require(basic.is_file() and 'hy2://' in basic.read_text(encoding='utf-8'),
                      f'{role} NekoBox 基础 URI 缺失')
              require('mport=443,20000-50000' in basic.read_text(encoding='utf-8'),
                      f'{role} NekoBox 基础 URI 缺少 mport')
              loon_import = directory / 'Loon-Import.txt'
              require(loon_import.is_file(), f'{role}缺少 Loon 正式导入文件')
              if expect_subscription:
                  require('format=nekobox&node=' in neko.read_text(encoding='utf-8'),
                          f'{role} NekoBox 单节点订阅地址缺失')
                  require('loon://import?nodelist=' in loon_import.read_text(encoding='utf-8'),
                          f'{role} Loon 正式导入链接缺失')
              else:
                  require(not neko.read_text(encoding='utf-8').strip(),
                          f'{role}未注册订阅中心却生成了完整 NekoBox 订阅')
                  require(not loon_import.read_text(encoding='utf-8').strip(),
                          f'{role}未注册订阅中心却生成了 Loon 导入链接')
              require(not (directory / 'NekoBoxForAndroid.yaml').exists(), f'{role}未清理旧 NekoBox YAML')
              require(not (directory / 'Loon-Shadowrocket.txt').exists(), f'{role}未清理旧混合分享文件')
              loon = (directory / 'Loon.conf').read_text(encoding='utf-8')
              require('server-ports="443,20000-50000"' in loon and 'hop-interval=30' in loon and
                      'download-bandwidth=50' in loon, f'{role} Loon 输出缺少端口跳跃或下载带宽')
              shadow = (directory / 'Shadowrocket.txt').read_text(encoding='utf-8')
              for field in ('peer=', 'fastopen=1', 'upmbps=30', 'downmbps=50', 'mport=443,20000-50000'):
                  require(field in shadow, f'{role} Shadowrocket 缺少参数：{field}')
              clash = (directory / 'Clash-Verge-Rev.yaml').read_text(encoding='utf-8')
              require('ports: "443,20000-50000"' in clash and 'hop-interval: "20-30"' in clash and
                      'up: "30 Mbps"' in clash and 'down: "50 Mbps"' in clash,
                      f'{role} Mihomo 输出缺少随机跳跃或 30/50 Mbps')
              require('proxy-groups:' not in clash and 'rules:' not in clash,
                      f'{role} Mihomo 输出仍包含策略组或规则')
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('isolation verify_new_outputs block not found')
          marker = "        state.write_text(json.dumps(sample_main_state(), ensure_ascii=False), encoding='utf-8')\n"
          inject = marker + "        client_cfg = root / 'etc/vvv/client.json'\n        client_cfg.parent.mkdir(parents=True, exist_ok=True)\n        client_cfg.write_text(json.dumps({'host_id': 'host-00000001', 'subscription_url': 'https://sub.example.test/secret'}), encoding='utf-8')\n"
          if inject not in text:
              if marker not in text:
                  raise SystemExit('main state marker not found')
              text = text.replace(marker, inject, 1)
          text = text.replace("verify_new_outputs(direct_dir, '主机')", "verify_new_outputs(direct_dir, '主机', True)")
          text = text.replace("verify_new_outputs(relay_dir, '中转线路')", "verify_new_outputs(relay_dir, '中转线路', True)")
          text = text.replace("require('NekoBoxForAndroid' in text and 'Quantumult X' in text, '主机汇总缺少客户端')",
                              "require('NekoBoxForAndroid' in text and 'Shadowrocket' in text and 'Quantumult X' in text, '主机汇总缺少客户端')")
          text = text.replace("require('NekoBoxForAndroid' in (root / 'root/中转客户端节点.txt').read_text(encoding='utf-8'),\n                '中转副机汇总缺少 NekoBox')",
                              "require('Shadowrocket' in (root / 'root/中转客户端节点.txt').read_text(encoding='utf-8'),\n                '中转副机汇总缺少 Shadowrocket')")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run targeted validation
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tests/client_upgrade_isolation_validation.py
          bash -n tests/final_runtime_validation.sh
          python3 tests/client_upgrade_isolation_validation.py
          python3 tests/test_client_port_hopping.py
          python3 tests/test_client_single_node_subscription.py
          python3 tests/conformance.py
      - name: Commit verified tests
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/final_runtime_validation.sh tests/client_upgrade_isolation_validation.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update client compatibility runtime tests'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
