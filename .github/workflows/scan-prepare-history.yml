name: Scan prepare.py history
on:
  push:
    paths:
      - '.github/workflows/scan-prepare-history.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan file history
        run: |
          set -Eeuo pipefail
          mkdir -p validation
          : > validation/prepare-history-scan.log
          git log --all --format='%H|%cI|%s' -- src/prepare.py | while IFS='|' read -r sha date subject; do
            content="$(git show "${sha}:src/prepare.py" 2>/dev/null || true)"
            [[ -n "$content" ]] || continue
            hy2_build=no; hy2_sync=no; vless_build=no; api_hot=no
            grep -q 'build_hy2_slot_configs' <<<"$content" && hy2_build=yes
            grep -q 'sync_hy2_slot_services' <<<"$content" && hy2_sync=yes
            grep -q 'build_vless_slot_configs' <<<"$content" && vless_build=yes
            grep -q 'xray_hot_apply' <<<"$content" && api_hot=yes
            printf '%s|%s|hy2_build=%s|hy2_sync=%s|vless_build=%s|api_hot=%s|%s\n' "$sha" "$date" "$hy2_build" "$hy2_sync" "$vless_build" "$api_hot" "$subject" >> validation/prepare-history-scan.log
          done
      - name: Publish scan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/prepare-history-scan.log
          git commit -m 'Record prepare.py history scan'
          git push
