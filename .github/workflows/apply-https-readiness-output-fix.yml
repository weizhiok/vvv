name: Apply HTTPS readiness output fix
on:
  push:
    paths:
      - '.github/workflows/apply-https-readiness-output-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/apply_https_readiness_output_fix.py
