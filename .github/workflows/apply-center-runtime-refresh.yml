name: Apply center runtime refresh
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_center_runtime_refresh.py'
      - 'trigger-center-runtime-refresh.txt'
      - '.github/workflows/apply-center-runtime-refresh.yml'
permissions:
  contents: write
concurrency:
  group: apply-center-runtime-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-address-registration
          fetch-depth: 0
      - name: Apply production patch
        run: python3 tools/apply_center_runtime_refresh.py
      - name: Validate center refresh
        run: |
          set -Eeuo pipefail
          bash -n core-src/bootstrap.sh
          python3 -m py_compile tests/conformance.py
          python3 tests/conformance.py
          grep -F 'refresh_center_runtime_code' core-src/bootstrap.sh
          grep -F 'cmp -s "$BASE_DIR/$file"' core-src/bootstrap.sh
          grep -F 'timeout 75 systemctl restart vvv-sub.service' core-src/bootstrap.sh
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_center_runtime_refresh.py trigger-center-runtime-refresh.txt .github/workflows/apply-center-runtime-refresh.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Refresh installed subscription center runtime"
          git push origin HEAD:agent/direct-address-registration
