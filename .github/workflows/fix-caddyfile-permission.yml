name: Fix Caddyfile permission

on:
  push:
    paths:
      - '.github/workflows/fix-caddyfile-permission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow Caddy service user to read config
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core-src/center_install.sh')
          text = path.read_text(encoding='utf-8')
          old = '''EOF

            /usr/local/bin/caddy validate \\
              --config /etc/caddy/Caddyfile \\
              --adapter caddyfile \\
              || fail "Caddy HTTPS 配置验证失败。"

            cat > /etc/systemd/system/caddy.service <<EOF
          '''
          new = '''EOF

            chown root:caddy /etc/caddy/Caddyfile
            chmod 640 /etc/caddy/Caddyfile
            runuser -u caddy -- /usr/local/bin/caddy validate \\
              --config /etc/caddy/Caddyfile \\
              --adapter caddyfile \\
              || fail "Caddy 用户无法读取或验证 HTTPS 配置。"

            cat > /etc/systemd/system/caddy.service <<EOF
          '''
          if old not in text:
              raise SystemExit('未找到 Caddy 配置验证代码块')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n core-src/center_install.sh
          grep -Fq 'chown root:caddy /etc/caddy/Caddyfile' core-src/center_install.sh
          grep -Fq 'chmod 640 /etc/caddy/Caddyfile' core-src/center_install.sh
          grep -Fq 'runuser -u caddy -- /usr/local/bin/caddy validate' core-src/center_install.sh

          mkdir -p validation
          cat > validation/caddy-permission.txt <<'EOF'
          status=ok
          config_owner=root:caddy
          config_mode=640
          validation_user=caddy
          shell=ok
          EOF

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core-src/center_install.sh validation/caddy-permission.txt
          git commit -m 'Allow Caddy service user to read config'
          git push
