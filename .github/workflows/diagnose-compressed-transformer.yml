name: Diagnose compressed VVV transformer
on:
  push:
    paths:
      - '.github/workflows/diagnose-compressed-transformer.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture results
        shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/cdiag
          r=validation/compressed-transformer-diagnostic.txt
          : >"$r"
          run(){ echo "===== $1 =====" >>"$r"; shift; "$@" >>"$r" 2>&1; echo "exit=$?" >>"$r"; }
          cat .staging-refactor/prepare.gz.part0{0,1,2,3,4} >/tmp/cdiag/source.b64
          run transport wc -c /tmp/cdiag/source.b64
          run transport_sha sha256sum /tmp/cdiag/source.b64
          run decode base64 -d /tmp/cdiag/source.b64
          base64 -d /tmp/cdiag/source.b64 >/tmp/cdiag/source.gz 2>>"$r"
          run gzip_size wc -c /tmp/cdiag/source.gz
          run gzip_sha sha256sum /tmp/cdiag/source.gz
          run gzip_test gzip -t /tmp/cdiag/source.gz
          gzip -dc /tmp/cdiag/source.gz >/tmp/cdiag/prepare.py 2>>"$r"
          run source_size wc -c /tmp/cdiag/prepare.py
          run source_sha sha256sum /tmp/cdiag/prepare.py
          run compile python3 -m py_compile /tmp/cdiag/prepare.py
          cp core-src/host.sh /tmp/cdiag/host.sh; cp core-src/landing.sh /tmp/cdiag/landing.sh; cp core-src/center_install.sh /tmp/cdiag/center.sh
          run transform python3 /tmp/cdiag/prepare.py /tmp/cdiag/host.sh /tmp/cdiag/landing.sh /tmp/cdiag/center.sh
          run host_syntax bash -n /tmp/cdiag/host.sh
          run landing_syntax sh -n /tmp/cdiag/landing.sh
          for p in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do echo "===== grep:$p =====" >>"$r"; grep -n "$p" /tmp/cdiag/host.sh|head -3 >>"$r" 2>&1; echo "exit=$?" >>"$r"; done
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/compressed-transformer-diagnostic.txt
          git commit -m 'Record compressed transformer diagnostics'
          git push
