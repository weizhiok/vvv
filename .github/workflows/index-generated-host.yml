name: Index generated host functions
on:
  push:
    paths:
      - '.github/workflows/index-generated-host.yml'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/index_shell_functions.py
          python3 tools/index_shell_functions.py > validation/generated-host-functions.txt
      - name: Publish index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/generated-host-functions.txt
          git commit -m 'Index generated host functions'
          git push
