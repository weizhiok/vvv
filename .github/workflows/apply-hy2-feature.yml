name: Apply HY2 feature integration
# This one-shot workflow removes itself after a successful integration commit.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-hy2-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hy2-port-hopping-node-management
          fetch-depth: 0
      - name: Normalize one-shot patch matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_hy2_feature.py')
          text = path.read_text(encoding='utf-8')
          normalized = []
          for line in text.splitlines(keepends=True):
              ending = '\n' if line.endswith('\n') else ''
              body = line[:-1] if ending else line
              trailing = len(body) - len(body.rstrip('\\'))
              if trailing % 2 == 1:
                  body += '\\'
              normalized.append(body + ending)
          text = ''.join(normalized)
          helper = '''
          def replace_last(path, old, new):
              value = read(path)
              position = value.rfind(old)
              if position < 0:
                  raise RuntimeError(f'{path}: expected a final literal match: {old[:100]!r}')
              write(path, value[:position] + new + value[position + len(old):])

          '''
          text = text.replace('\ndef replace_regex', '\n' + helper + 'def replace_regex', 1)
          marker = "replace_once('core-src/landing.sh',\n'''echo \"日本入口：${JAPAN_PUBLIC_IP}:${JAPAN_PORT}\""
          position = text.index(marker)
          text = text[:position] + text[position:].replace('replace_once(', 'replace_last(', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply integration patch
        run: python3 tools/apply_hy2_feature.py
      - name: Compile Python modules
        run: python3 -m py_compile core-src/*.py tests/*.py
      - name: Run feature tests
        run: |
          python3 tests/test_hy2_port_hopping.py
          python3 tests/test_client_port_hopping.py
          python3 tests/test_subscription_node_order.py
          chmod +x tests/test_quick_upstream_commands.sh
          tests/test_quick_upstream_commands.sh
      - name: Run existing fast regression tests
        run: |
          python3 tests/test_relay_ticket_stdout.py
          python3 tests/test_lifecycle_source_uniqueness.py
          chmod +x tests/test_deleted_slot_reclaim.sh tests/test_node_lifecycle.sh
          tests/test_deleted_slot_reclaim.sh
          tests/test_node_lifecycle.sh
      - name: Remove one-shot patch machinery
        run: rm -f tools/apply_hy2_feature.py .github/workflows/apply-hy2-feature.yml
      - name: Commit integrated feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add HY2 port hopping and subscription node controls'
          git push origin HEAD:agent/hy2-port-hopping-node-management
