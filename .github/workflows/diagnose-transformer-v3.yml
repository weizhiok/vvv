name: Diagnose VVV transformer v3
on:
  push:
    paths:
      - '.github/workflows/diagnose-transformer-v3.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          mkdir -p validation /tmp/v3diag
          r=validation/transformer-v3-diagnostic.txt
          : >"$r"
          cat .staging-refactor/prepare.v2.gz.part00 .staging-refactor/prepare.v2.gz.part01 .staging-refactor/prepare.v2.gz.part02 .staging-refactor/prepare.v3.gz.part030 .staging-refactor/prepare.v3.gz.part031 .staging-refactor/prepare.v2.gz.part04 >/tmp/v3diag/source.b64
          echo "b64_size=$(wc -c </tmp/v3diag/source.b64)" >>"$r"; echo "b64_sha=$(sha256sum /tmp/v3diag/source.b64|awk '{print $1}')" >>"$r"
          base64 -d /tmp/v3diag/source.b64 >/tmp/v3diag/source.gz 2>/tmp/v3diag/decode.err; echo "decode_exit=$?" >>"$r"; sed 's/^/decode_error=/' /tmp/v3diag/decode.err >>"$r"
          echo "gzip_sha=$(sha256sum /tmp/v3diag/source.gz|awk '{print $1}')" >>"$r"
          gzip -t /tmp/v3diag/source.gz 2>/tmp/v3diag/gtest.err; echo "gzip_test_exit=$?" >>"$r"; sed 's/^/gzip_error=/' /tmp/v3diag/gtest.err >>"$r"
          gzip -dc /tmp/v3diag/source.gz >/tmp/v3diag/prepare.py 2>/tmp/v3diag/unzip.err; echo "unzip_exit=$?" >>"$r"
          echo "source_sha=$(sha256sum /tmp/v3diag/prepare.py|awk '{print $1}')" >>"$r"
          python3 -m py_compile /tmp/v3diag/prepare.py 2>/tmp/v3diag/compile.err; echo "compile_exit=$?" >>"$r"; sed 's/^/compile_error=/' /tmp/v3diag/compile.err >>"$r"
          cp core-src/host.sh /tmp/v3diag/host.sh; cp core-src/landing.sh /tmp/v3diag/landing.sh; cp core-src/center_install.sh /tmp/v3diag/center.sh
          python3 /tmp/v3diag/prepare.py /tmp/v3diag/host.sh /tmp/v3diag/landing.sh /tmp/v3diag/center.sh 2>/tmp/v3diag/transform.err; echo "transform_exit=$?" >>"$r"; sed 's/^/transform_error=/' /tmp/v3diag/transform.err >>"$r"
          bash -n /tmp/v3diag/host.sh 2>/tmp/v3diag/host.err; echo "host_syntax_exit=$?" >>"$r"; sed 's/^/host_error=/' /tmp/v3diag/host.err >>"$r"
          sh -n /tmp/v3diag/landing.sh 2>/tmp/v3diag/landing.err; echo "landing_syntax_exit=$?" >>"$r"; sed 's/^/landing_error=/' /tmp/v3diag/landing.err >>"$r"
          for p in reserve_users api-in 'api adrules' 'xray 主进程未重启'; do grep -q "$p" /tmp/v3diag/host.sh; echo "feature_${p// /_}=$?" >>"$r"; done
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/transformer-v3-diagnostic.txt
          git commit -m 'Record transformer v3 diagnostics'
          git push
