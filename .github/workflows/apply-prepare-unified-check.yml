name: Apply prepare unified check
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: prepare-unified-check
  cancel-in-progress: true
jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/unified-subscription-transports'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-subscription-transports
          fetch-depth: 0
      - name: Apply prepare patch
        run: python3 tools/apply_prepare_unified_check.py
      - name: Validate
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 -m py_compile src/prepare.py tests/conformance.py
          python3 tests/conformance.py
          cp core-src/host.sh /tmp/host.sh
          cp core-src/landing.sh /tmp/landing.sh
          cp core-src/center_install.sh /tmp/center.sh
          python3 src/prepare.py /tmp/host.sh /tmp/landing.sh /tmp/center.sh
          bash -n /tmp/host.sh
          sh -n /tmp/landing.sh
          bash -n /tmp/center.sh
      - name: Commit production changes
        run: |
          set -Eeuo pipefail
          git config user.name weizhiok
          git config user.email 165847692+weizhiok@users.noreply.github.com
          rm -f tools/apply_prepare_unified_check.py .github/workflows/apply-prepare-unified-check.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "Validate unified center source fields"
          git push origin HEAD:agent/unified-subscription-transports
