name: SSH fix actions probe
on:
  push:
    paths:
      - '.github/workflows/ssh-fix-actions-probe.yml'
concurrency:
  group: ssh-fix-marked-direct-publisher-v4
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mark direct publisher start
        run: |
          echo 'direct-publisher-started=1' > direct-publisher-started.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add direct-publisher-started.txt
          git commit -m 'Mark direct SSH fix publisher start'
          git push
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - run: bash tools/direct_publish_ssh_fix.sh
