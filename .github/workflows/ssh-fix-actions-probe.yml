name: SSH fix actions probe
on:
  push:
    paths:
      - '.github/workflows/ssh-fix-actions-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo 'ssh-fix-actions-probe=isolated-2' > ssh-fix-actions-probe.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ssh-fix-actions-probe.txt
          git commit -m 'Record isolated SSH fix Actions probe'
          git push
