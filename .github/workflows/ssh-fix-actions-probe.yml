name: SSH fix actions probe
on:
  push:
    paths:
      - '.github/workflows/ssh-fix-actions-probe.yml'
concurrency:
  group: ssh-fix-production-commit-v6
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/commit_validated_production_fix.sh
