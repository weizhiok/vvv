name: SSH fix actions probe
on:
  push:
    paths:
      - '.github/workflows/ssh-fix-actions-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mark publisher start
        run: |
          echo 'ssh-fix-publisher-started=1' > ssh-fix-publisher-started.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ssh-fix-publisher-started.txt
          git commit -m 'Mark SSH fix publisher start'
          git push
      - name: Publish validated source fixes
        run: bash tools/run_quick_ssh_fix.sh
