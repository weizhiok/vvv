name: SSH fix actions probe
on:
  push:
    paths:
      - '.github/workflows/ssh-fix-actions-probe.yml'
concurrency:
  group: ssh-fix-refreshed-production-commit-v7
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mark production commit start
        run: |
          echo 'production-commit-started=1' > validation/production-commit-started.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/production-commit-started.txt
          git commit -m 'Mark production SSH fix commit start'
          git push
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - run: bash tools/commit_validated_production_fix.sh
