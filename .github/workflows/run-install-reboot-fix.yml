name: Run install reboot guard patcher
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-install-reboot-fix.yml'
      - 'tools/apply_install_reboot_fix.py'
permissions:
  contents: write
concurrency:
  group: run-install-reboot-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fix
        run: python3 tools/apply_install_reboot_fix.py
      - name: Validate fix
        run: |
          set -Eeuo pipefail
          bash -n core-src/host.sh
          bash -n core-src/hy2_port_hop.sh
          python3 tests/test_install_reboot_guard.py
          python3 tests/test_hy2_port_hopping.py
          python3 tests/conformance.py
      - name: Commit verified source changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core-src/host.sh core-src/hy2_port_hop.sh tests/test_install_reboot_guard.py .github/workflows/validate.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Prevent install-time reboot disconnects'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
