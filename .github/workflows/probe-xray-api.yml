name: Probe Xray API syntax
on:
  push:
    paths:
      - '.github/workflows/probe-xray-api.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Xray and capture API help
        shell: bash
        run: |
          set -Eeuo pipefail
          api=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest)
          url=$(jq -r '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url' <<<"$api")
          curl -fsSL "$url" -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp
          chmod +x /tmp/xray
          mkdir -p validation
          {
            /tmp/xray version
            for c in adi ado rmi rmo adrules rmrules inbounduser inboundadduser inboundremoveuser; do
              echo "===== $c ====="
              /tmp/xray help api "$c" 2>&1 || true
            done
          } > validation/xray-api-help.txt
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/xray-api-help.txt
          git commit -m 'Record Xray API command syntax'
          git push
